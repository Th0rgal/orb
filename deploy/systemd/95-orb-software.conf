# Hardened drop-in for orb-node.service / sandboxed-node.service.
# Replaces the legacy NoNewPrivileges=false + ReadWritePaths=/usr/local/bin drop-in:
# - /usr/local/bin remains root:root 0755 (ReadOnlyPaths=/usr/local/bin)
# - NoNewPrivileges=true prevents unapproved privilege escalation inside missions
# - Fleet harness updates and Touch-ID-approved root commands route through /run/orb-privd.sock
[Service]
NoNewPrivileges=true
ReadOnlyPaths=/usr/local/bin
ReadWritePaths=/var/lib/orb-software /opt/sandboxed-tools
Environment="AGENT_SOFTWARE_STATE_DIR=/var/lib/orb-software"
Environment="ORB_PRIVD_SOCKET=/run/orb-privd.sock"
