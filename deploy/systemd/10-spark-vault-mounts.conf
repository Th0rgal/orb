# systemd drop-in ensuring the encrypted Sovereign Vault (/mnt/spark-vault) and
# its /etc/lean-mesh bind-mount are active in PID 1's mount namespace before
# starting mesh and Hindsight services on dgx-spark (10.88.0.2).
#
# Install on dgx-spark:
#   for svc in lean-mesh lean-mesh-heartbeat spark-memory-gateway \
#              spark-memory-signal-live spark-memory-telegram-live \
#              spark-memory-tunnel spark-arbiter; do
#     mkdir -p "/etc/systemd/system/${svc}.service.d"
#     cp deploy/systemd/10-spark-vault-mounts.conf \
#       "/etc/systemd/system/${svc}.service.d/10-spark-vault-mounts.conf"
#   done
#   systemctl daemon-reload

[Unit]
RequiresMountsFor=/mnt/spark-vault /etc/lean-mesh
