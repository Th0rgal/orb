# systemd drop-in ensuring encrypted Paloma vault bind-mounts are mounted in
# PID 1's mount namespace before starting dependent control-plane services on agent-core.
#
# Install for each vault-backed service on agent-core (sandboxed-sh-prod,
# sandboxed-sh-dev, lean-mesh, lean-mesh-heartbeat-relay, lean-mesh-status-proxy,
# orb-audit-shipper, sandboxed-development-identity):
#
#   for svc in sandboxed-sh-prod sandboxed-sh-dev lean-mesh lean-mesh-heartbeat-relay \
#              lean-mesh-status-proxy orb-audit-shipper sandboxed-development-identity; do
#     mkdir -p "/etc/systemd/system/${svc}.service.d"
#     cp deploy/systemd/10-paloma-vault-mounts.conf \
#       "/etc/systemd/system/${svc}.service.d/10-paloma-vault-mounts.conf"
#   done
#   systemctl daemon-reload

[Unit]
RequiresMountsFor=/mnt/paloma-vault /etc/paloma /etc/lean-mesh /etc/open_agent /etc/sandboxed-sh/development-identity
