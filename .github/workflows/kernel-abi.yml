name: Kernel ABI

on:
  push:
    branches: [master, main, "release/*"]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kernel-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Lean 4.35.0 toolchain (direct SHA-256 verified release, no elan)
        run: |
          set -euo pipefail
          LEAN_ARCHIVE="/tmp/lean-4.35.0-linux.tar.zst"
          LEAN_SHA256="7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d"
          curl --retry 5 --retry-all-errors -fsSL \
            "https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst" \
            -o "$LEAN_ARCHIVE"
          echo "${LEAN_SHA256}  ${LEAN_ARCHIVE}" | sha256sum -c -
          mkdir -p "$HOME/.local/lean-4.35.0"
          tar --zstd -xf "$LEAN_ARCHIVE" --strip-components=1 -C "$HOME/.local/lean-4.35.0"
          rm -f "$LEAN_ARCHIVE"
          echo "$HOME/.local/lean-4.35.0/bin" >> "$GITHUB_PATH"
          "$HOME/.local/lean-4.35.0/bin/lean" --version
      - name: Lean build (direct compiler, sorry is an error) and axiom / vacuity audit
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Orb .lake/build/ir/Orb
          lean -DwarningAsError=true -DautoImplicit=false Orb/Kernel.lean \
            -o .lake/build/lib/lean/Orb/Kernel.olean \
            -i .lake/build/lib/lean/Orb/Kernel.ilean \
            -c .lake/build/ir/Orb/Kernel.c
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/Spec.lean \
            -o .lake/build/lib/lean/Orb/Spec.olean \
            -i .lake/build/lib/lean/Orb/Spec.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/MutantSuite.lean \
            -o .lake/build/lib/lean/Orb/MutantSuite.olean \
            -i .lake/build/lib/lean/Orb/MutantSuite.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true audit/AuditSpec.lean
          lean -DwarningAsError=true -DautoImplicit=false Orb/Scroll.lean \
            -o .lake/build/lib/lean/Orb/Scroll.olean \
            -i .lake/build/lib/lean/Orb/Scroll.ilean
          lean -DwarningAsError=true -DautoImplicit=false Orb/Stream.lean \
            -o .lake/build/lib/lean/Orb/Stream.olean \
            -i .lake/build/lib/lean/Orb/Stream.ilean
      - name: Scroll policy fixtures match Lean (Orb.Scroll)
        run: |
          set -euo pipefail
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_scroll_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/scroll-policy.json
      - name: Streaming commit fixtures match Lean (Orb.Stream)
        run: |
          set -euo pipefail
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_stream_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/stream-commit.json
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_stream_cost_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/stream-cost.json
      - name: Vendored C matches Lean (Orb.Kernel + pinned lean-sys)
        run: python3 scripts/gen_orb_kernel_unboxed.py --check
      - name: Generated bindings are up to date
        run: python3 scripts/gen_kernel_bindings.py --check
      - name: Scalar shared WASM validates its complete ABI and has no imports
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/test_wasm_abi.py
          mkdir -p audit-results
          python3 scripts/build_orb_kernel_wasm.py \
            --lean-bin-dir "$(lean --print-prefix)/bin" \
            --check --out orb/src/assets/orb_kernel.wasm \
            --receipt audit-results/wasm-build.json
      - name: Kernel call-site lint
        run: python3 scripts/lint_kernel_calls.py
      - name: Manifest / generator / lint regression tests
        run: python3 -m unittest -v scripts/test_kernel_abi.py
      - name: Shared scalar conformance harness rejects malformed evidence
        run: python3 -m unittest -v scripts/test_shared_kernel_conformance.py
      - name: Native object and archive symbol checks with negative injections
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --locked -j 1 -p orb-spec --test artifact_symbols
      - name: Partial coverage evidence stays source-bound and incomplete
        run: |
          python3 scripts/gen_coverage_registry.py --check
          python3 -m unittest discover -s scripts -p test_coverage_registry.py -v
      - name: C-ABI and JNI compile
        run: |
          set -euo pipefail
          JNI_INC="$JAVA_HOME/include"
          gcc -std=c11 -Wall -Werror -fsyntax-only -x c shared/orb-spec/cabi/orb_kernel.h
          gcc -O2 -fPIC -c shared/orb-spec/cabi/orb_kernel_unboxed.c -o /tmp/orb_kernel.o
          gcc -O2 -fPIC -Wall -Werror -Wno-unused-parameter -I"$JNI_INC" -I"$JNI_INC/linux" -Iandroid_dashboard/app/src \
            -c android_dashboard/app/src/main/jni/orb_kernel_jni.c -o /tmp/orb_kernel_jni.o
          gcc -shared /tmp/orb_kernel.o /tmp/orb_kernel_jni.o -o /tmp/liborb_kernel.so
          python3 - <<'PY'
          import json, subprocess
          m = json.load(open("shared/orb-spec/kernel_abi.json"))
          syms = set(subprocess.run(["nm", "-D", "--defined-only", "/tmp/liborb_kernel.so"],
                                    capture_output=True, text=True, check=True).stdout.split())
          want = {f["name"] for f in m["functions"]}
          want |= {"Java_" + m["jni"]["class"].replace(".", "_") + "_" + f["jni"]["method"]
                   for f in m["functions"] if "jni" in f}
          missing = sorted(want - syms)
          assert not missing, f"missing exports: {missing}"
          print(f"{len(want)} manifest symbols exported")
          PY
      - name: Android JNI libraries rebuild with the NDK and match sources / ABI
        run: scripts/build_android_kernel_so.sh --check

      - name: Read reviewed turbo-lean source revision
        id: turbo-pin
        run: |
          revision=$(cat lean/turbo-lean-revision)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Th0rgal/turbo-lean
          ref: ${{ steps.turbo-pin.outputs.revision }}
          path: .tools/turbo-lean
          persist-credentials: false
      - name: Build reviewed turbo-lean and record binary provenance
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          source_dir="$PWD/.tools/turbo-lean"
          expected=$(cat lean/turbo-lean-revision)
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$expected"
          test -z "$(git -C "$source_dir" status --porcelain)"
          test "$(cat "$source_dir/lean/lean-toolchain")" = "$(cat lean/lean-toolchain)"
          (cd "$source_dir/lean" && lake build LeanSys LeanNative.Spec)
          cargo build --locked -j 1 --manifest-path "$source_dir/Cargo.toml" -p turbo-lean
          git -C "$source_dir" diff --exit-code
          mkdir -p audit-results
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, subprocess
          binary = pathlib.Path(".tools/turbo-lean/target/debug/turbo-lean")
          receipt = {
              "repository": "https://github.com/Th0rgal/turbo-lean",
              "revision": pathlib.Path("lean/turbo-lean-revision").read_text().strip(),
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "version": subprocess.check_output([str(binary), "--version"], text=True).strip(),
          }
          pathlib.Path("audit-results/turbo-lean-provenance.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PYCODE
      - name: Fresh turbo-lean tightness and horizontal-packing gate
        env:
          TURBO_LEAN_NO_AUDIT_CACHE: "1"
          SANDBOXED_TELEMETRY_BATCH_ONLY: "1"
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/test_spec_audit.py
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/Spec.lean > audit-results/spec-audit.json
          python3 scripts/check_spec_audit.py audit-results/spec-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/MutantSuite.lean > audit-results/mutant-audit.json
          python3 scripts/check_spec_audit.py audit-results/mutant-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/Stream.lean > audit-results/stream-audit.json
          python3 scripts/check_spec_audit.py audit-results/stream-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-spec-audit
          path: audit-results/
          if-no-files-found: ignore
