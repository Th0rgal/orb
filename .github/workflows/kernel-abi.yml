name: Kernel ABI

on:
  push:
    branches: [master, main, "release/*"]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Same planner as ci.yml: skip the kernel audit when no kernel input changed.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run_wf_kernel_abi }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: plan
        run: |
          python3 scripts/ci_plan.py \
            --event "${{ github.event_name }}" --ref "${{ github.ref }}" \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.sha }}" --github-output "$GITHUB_OUTPUT"

  kernel-abi:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-turbo-lean
        with:
          provenance-path: audit-results/turbo-lean-provenance.json
      - name: Lean build via turbo-lean, pr-verify / ci-verify, and axiom / vacuity audit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p audit-results
          TURBO_LEAN_EMIT_C=1 turbo-lean build --project-dir lean
          LEAN_PATH=lean/.lake/build/lib/lean lean -DwarningAsError=true lean/audit/AuditSpec.lean
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="${PR_BASE_SHA:-origin/master}"
            git cat-file -e "${base_ref}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base_ref"
            turbo-lean --json pr-verify --project-dir lean --scope Orb --base "$base_ref" --mode untrusted --kernel auto --receipt audit-results/kernel-verify-receipt.json
          else
            turbo-lean --json ci-verify --project-dir lean --scope Orb --mode trusted --seed-shards --kernel auto --receipt audit-results/kernel-verify-receipt.json
          fi
      - name: Scroll policy fixtures match Lean (Orb.Scroll)
        run: |
          set -euo pipefail
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_scroll_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/scroll-policy.json
      - name: Transcript gate fixtures match Lean (Orb.Transcript)
        run: |
          set -euo pipefail
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_transcript_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/transcript-gates.json
      - name: Streaming commit fixtures match Lean (Orb.Stream)
        run: |
          set -euo pipefail
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_stream_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/stream-commit.json
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_stream_cost_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/stream-cost.json
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_r6a_client_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/r6a-client-kernel.json
      - name: Vendored C matches Lean (Orb.Kernel + pinned lean-sys)
        run: python3 scripts/gen_orb_kernel_unboxed.py --check
      - name: Committed LeanNative textual LLVM IR matches sources, symbol hygiene, and stock C
        run: |
          set -euo pipefail
          python3 scripts/gen_orb_kernel_leannative_ll.py --check
          python3 -m unittest -v scripts/test_leannative_ll.py
      - name: Generated bindings are up to date
        run: python3 scripts/gen_kernel_bindings.py --check
      - name: Scalar shared WASM validates its complete ABI and has no imports
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/test_wasm_abi.py
          mkdir -p audit-results
          python3 scripts/build_orb_kernel_wasm.py \
            --lean-bin-dir "$(lean --print-prefix)/bin" \
            --check --out orb/src/assets/orb_kernel.wasm \
            --receipt audit-results/wasm-build.json
      - name: Kernel call-site lint
        run: python3 scripts/lint_kernel_calls.py
      - name: Manifest / generator / lint regression tests
        run: python3 -m unittest -v scripts/test_kernel_abi.py
      - name: Shared scalar conformance harness rejects malformed evidence
        run: python3 -m unittest -v scripts/test_shared_kernel_conformance.py
      - name: P3 receipts and stock-C / LeanNative backend rollback
        run: |
          python3 -m pip install --disable-pip-version-check cryptography==41.0.7
          python3 -m unittest -v scripts/test_p3_qualification.py
          python3 scripts/run_p3_qualification.py \
            --out audit-results/p3-stock \
            --backend stock-c \
            --rollback-stock
      - name: Native object and archive symbol checks with negative injections
        run: python3 -m unittest -v scripts/test_p3_qualification.py
      - name: Partial coverage evidence stays source-bound and incomplete
        run: |
          python3 scripts/gen_coverage_registry.py --check
          python3 -m unittest discover -s scripts -p test_coverage_registry.py -v
      - name: C-ABI and JNI compile
        run: |
          set -euo pipefail
          JNI_INC="$JAVA_HOME/include"
          gcc -std=c11 -Wall -Werror -fsyntax-only -x c shared/orb-spec/cabi/orb_kernel.h
          gcc -O2 -fPIC -c shared/orb-spec/cabi/orb_kernel_unboxed.c -o /tmp/orb_kernel.o
          gcc -O2 -fPIC -Wall -Werror -Wno-unused-parameter -I"$JNI_INC" -I"$JNI_INC/linux" -Iandroid_dashboard/app/src \
            -c android_dashboard/app/src/main/jni/orb_kernel_jni.c -o /tmp/orb_kernel_jni.o
          gcc -shared /tmp/orb_kernel.o /tmp/orb_kernel_jni.o -o /tmp/liborb_kernel.so
          python3 - <<'PY'
          import json, subprocess
          m = json.load(open("shared/orb-spec/kernel_abi.json"))
          syms = set(subprocess.run(["nm", "-D", "--defined-only", "/tmp/liborb_kernel.so"],
                                    capture_output=True, text=True, check=True).stdout.split())
          want = {f["name"] for f in m["functions"]}
          want |= {"Java_" + m["jni"]["class"].replace(".", "_") + "_" + f["jni"]["method"]
                   for f in m["functions"] if "jni" in f}
          missing = sorted(want - syms)
          assert not missing, f"missing exports: {missing}"
          print(f"{len(want)} manifest symbols exported")
          PY
      - name: Android JNI libraries rebuild with the NDK and match sources / ABI
        run: scripts/build_android_kernel_so.sh --check

      - name: Build and self-test OrbNetLeaf + Wave 1-4 native binaries and test suites (<= 220 C LOC, zero lean_elab)
        run: |
          set -euo pipefail
          ./scripts/ci_harden_ubuntu_apt.sh
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libsqlite3-dev
          for cfile in \
            lean/OrbNetLeaf/c/orb_net_leaf.c \
            lean/OrbBin/c/orb_bin_posix.c \
            lean/OrbBin/c/orb_bin_sqlite.c \
            lean/OrbNode/c/orb_node_posix.c \
            lean/OrbCore/c/orb_core_sqlite.c \
            linux_shell/main.c \
            linux_shell/gtk_chrome.c \
            linux_shell/gtk_icons.c \
            linux_shell/gtk_menu.c
          do
            c_lines=$(wc -l < "$cfile")
            echo "$cfile LOC: $c_lines"
            test "$c_lines" -le 220
          done
          ./scripts/build_orb_bins.sh --with-tests --out-dir target/debug
          ax_out=$(printf 'import OrbClient.Reducers\n#print axioms OrbClient.Reducers.parse_encode_orb_client_patch_roundtrip\n' | LEAN_PATH="lean/OrbClient/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --stdin)
          echo "$ax_out"
          echo "$ax_out" | grep -qF "depends on axioms: [propext, Classical.choice, Quot.sound]"
          out=$(LEAN_PATH="lean/OrbClient/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_client_core_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/client-core.json
      - name: Batched turbo-lean tightness and horizontal-packing gate
        env:
          SANDBOXED_TELEMETRY_BATCH_ONLY: "1"
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/test_spec_audit.py
          turbo-lean --json audit-spec --policy strict-proofs --require-nonempty \
            lean/Orb/Spec.lean \
            lean/Orb/MutantSuite.lean \
            lean/Orb/StatefulMutantSuite.lean \
            lean/Orb/LifecycleSpec.lean \
            lean/Orb/LifecycleMutants.lean \
            lean/Orb/HarnessCloudSpec.lean \
            lean/Orb/HarnessCloudMutants.lean \
            lean/Orb/ManagedNodeSpec.lean \
            lean/Orb/ManagedNodeMutants.lean \
            lean/Orb/Stream.lean \
            lean/Orb/Transcript.lean \
            lean/OrbNetLeaf/OrbNetLeaf/Spec.lean \
            lean/OrbNetLeaf/OrbNetLeaf/MutantSuite.lean \
            lean/OrbBin/OrbBin/Spec.lean \
            lean/OrbBin/OrbBin/MutantSuite.lean \
            lean/OrbNode/OrbNode/Spec.lean \
            lean/OrbNode/OrbNode/MutantSuite.lean \
            lean/OrbClient/OrbClient/Spec.lean \
            lean/OrbClient/OrbClient/MutantSuite.lean \
            lean/OrbClient/OrbClient/Reducers.lean \
            lean/OrbCore/OrbCore/Spec.lean \
            lean/OrbCore/OrbCore/MutantSuite.lean \
            lean/OrbLocald/OrbLocald/Spec.lean \
            lean/OrbLocald/OrbLocald/MutantSuite.lean \
            > audit-results/spec-audit-batch.json
          python3 scripts/check_spec_audit.py audit-results/spec-audit-batch.json
      - name: Export turbo-lean CAS bundle (.tlpack)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          mkdir -p "${RUNNER_TEMP}/.turbo-pack"
          turbo-lean export "${RUNNER_TEMP}/.turbo-pack/cache.tlpack"
      - name: Save turbo-lean CAS bundle (.tlpack)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/.turbo-pack
          key: turbo-lean-cas-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lake-manifest.json', 'lean/**/*.lean') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-spec-audit
          path: audit-results/
          if-no-files-found: ignore
