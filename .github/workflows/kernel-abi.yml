name: Kernel ABI

on:
  push:
    branches: [master, main, "release/*"]
    # Roadmap/docs pushes must not queue behind (and so cancel) pending master runs.
    # Ordered paths filter (later matching pattern wins): include everything,
    # exclude prose docs, then re-include docs/ inputs read by CI scripts.
    paths:
      - '**'
      - '!docs/**'
      - '!README.md'
      - '!INSTALL.md'
      - '!DEBUGGING.md'
      - '!AGENTS.md'
      - 'docs/FORMAL_AUDIT.md'
      - 'docs/P1_SHARED_KERNEL_CONFORMANCE.md'
      - 'docs/P2_SHARED_WASM_ARTIFACT.md'
      - 'docs/P3_TARGET_QUALIFICATION_REPORT.md'
      - 'docs/TRUSTWORTHY_SHARED_LEAN_ROADMAP.md'
      - 'docs/specs/state-machine-inventory.md'
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Same planner as ci.yml: skip the kernel audit when no kernel input changed.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run_wf_kernel_abi }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: plan
        run: |
          python3 scripts/ci_plan.py \
            --event "${{ github.event_name }}" --ref "${{ github.ref }}" \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.sha }}" --github-output "$GITHUB_OUTPUT"

  kernel-abi:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Lean 4.35.0 toolchain (direct SHA-256 verified release, no elan)
        run: |
          set -euo pipefail
          LEAN_ARCHIVE="/tmp/lean-4.35.0-linux.tar.zst"
          LEAN_SHA256="7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d"
          curl --retry 5 --retry-all-errors -fsSL \
            "https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst" \
            -o "$LEAN_ARCHIVE"
          echo "${LEAN_SHA256}  ${LEAN_ARCHIVE}" | sha256sum -c -
          mkdir -p "$HOME/.local/lean-4.35.0"
          tar --zstd -xf "$LEAN_ARCHIVE" --strip-components=1 -C "$HOME/.local/lean-4.35.0"
          rm -f "$LEAN_ARCHIVE"
          echo "$HOME/.local/lean-4.35.0/bin" >> "$GITHUB_PATH"
          "$HOME/.local/lean-4.35.0/bin/lean" --version
      - name: Lean build (direct compiler, sorry is an error) and axiom / vacuity audit
        working-directory: lean
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/Orb .lake/build/ir/Orb
          lean -DwarningAsError=true -DautoImplicit=false Orb/Scroll.lean \
            -o .lake/build/lib/lean/Orb/Scroll.olean \
            -i .lake/build/lib/lean/Orb/Scroll.ilean
          lean -DwarningAsError=true -DautoImplicit=false Orb/Stream.lean \
            -o .lake/build/lib/lean/Orb/Stream.olean \
            -i .lake/build/lib/lean/Orb/Stream.ilean
          lean -DwarningAsError=true -DautoImplicit=false Orb/Kernel.lean \
            -o .lake/build/lib/lean/Orb/Kernel.olean \
            -i .lake/build/lib/lean/Orb/Kernel.ilean \
            -c .lake/build/ir/Orb/Kernel.c
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/Spec.lean \
            -o .lake/build/lib/lean/Orb/Spec.olean \
            -i .lake/build/lib/lean/Orb/Spec.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/MutantSuite.lean \
            -o .lake/build/lib/lean/Orb/MutantSuite.olean \
            -i .lake/build/lib/lean/Orb/MutantSuite.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/StatefulMutantSuite.lean \
            -o .lake/build/lib/lean/Orb/StatefulMutantSuite.olean \
            -i .lake/build/lib/lean/Orb/StatefulMutantSuite.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/Lifecycle.lean \
            -o .lake/build/lib/lean/Orb/Lifecycle.olean \
            -i .lake/build/lib/lean/Orb/Lifecycle.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/LifecycleSpec.lean \
            -o .lake/build/lib/lean/Orb/LifecycleSpec.olean \
            -i .lake/build/lib/lean/Orb/LifecycleSpec.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/LifecycleMutants.lean \
            -o .lake/build/lib/lean/Orb/LifecycleMutants.olean \
            -i .lake/build/lib/lean/Orb/LifecycleMutants.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/HarnessCloud.lean \
            -o .lake/build/lib/lean/Orb/HarnessCloud.olean \
            -i .lake/build/lib/lean/Orb/HarnessCloud.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/HarnessCloudSpec.lean \
            -o .lake/build/lib/lean/Orb/HarnessCloudSpec.olean \
            -i .lake/build/lib/lean/Orb/HarnessCloudSpec.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/HarnessCloudMutants.lean \
            -o .lake/build/lib/lean/Orb/HarnessCloudMutants.olean \
            -i .lake/build/lib/lean/Orb/HarnessCloudMutants.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/ManagedNode.lean \
            -o .lake/build/lib/lean/Orb/ManagedNode.olean \
            -i .lake/build/lib/lean/Orb/ManagedNode.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/ManagedNodeSpec.lean \
            -o .lake/build/lib/lean/Orb/ManagedNodeSpec.olean \
            -i .lake/build/lib/lean/Orb/ManagedNodeSpec.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true -DautoImplicit=false Orb/ManagedNodeMutants.lean \
            -o .lake/build/lib/lean/Orb/ManagedNodeMutants.olean \
            -i .lake/build/lib/lean/Orb/ManagedNodeMutants.ilean
          LEAN_PATH=.lake/build/lib/lean lean -DwarningAsError=true audit/AuditSpec.lean
          lean -DwarningAsError=true -DautoImplicit=false Orb/Transcript.lean \
            -o .lake/build/lib/lean/Orb/Transcript.olean \
            -i .lake/build/lib/lean/Orb/Transcript.ilean
      - name: Scroll policy fixtures match Lean (Orb.Scroll)
        run: |
          set -euo pipefail
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_scroll_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/scroll-policy.json
      - name: Transcript gate fixtures match Lean (Orb.Transcript)
        run: |
          set -euo pipefail
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_transcript_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/transcript-gates.json
      - name: Streaming commit fixtures match Lean (Orb.Stream)
        run: |
          set -euo pipefail
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_stream_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/stream-commit.json
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_stream_cost_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/stream-cost.json
          out=$(LEAN_PATH="lean/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_r6a_client_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/r6a-client-kernel.json
      - name: Vendored C matches Lean (Orb.Kernel + pinned lean-sys)
        run: python3 scripts/gen_orb_kernel_unboxed.py --check
      - name: Committed LeanNative textual LLVM IR matches sources, symbol hygiene, and stock C
        run: |
          set -euo pipefail
          python3 scripts/gen_orb_kernel_leannative_ll.py --check
          python3 -m unittest -v scripts/test_leannative_ll.py
      - name: Generated bindings are up to date
        run: python3 scripts/gen_kernel_bindings.py --check
      - name: turbo-lean FFI allowlist matches the @[extern] declarations
        run: python3 scripts/gen_turbo_lean_ffi.py --check
      - name: Scalar shared WASM validates its complete ABI and has no imports
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/test_wasm_abi.py
          mkdir -p audit-results
          python3 scripts/build_orb_kernel_wasm.py \
            --lean-bin-dir "$(lean --print-prefix)/bin" \
            --check --out orb/src/assets/orb_kernel.wasm \
            --receipt audit-results/wasm-build.json
      - name: Kernel call-site lint
        run: python3 scripts/lint_kernel_calls.py
      - name: Manifest / generator / lint regression tests
        run: python3 -m unittest -v scripts/test_kernel_abi.py
      - name: Shared scalar conformance harness rejects malformed evidence
        run: python3 -m unittest -v scripts/test_shared_kernel_conformance.py
      - name: P3 receipts and stock-C / LeanNative backend rollback
        run: |
          python3 -m pip install --disable-pip-version-check cryptography==41.0.7
          python3 -m unittest -v scripts/test_p3_qualification.py
          python3 scripts/run_p3_qualification.py \
            --out audit-results/p3-stock \
            --backend stock-c \
            --rollback-stock
      - name: Native object and archive symbol checks with negative injections
        run: python3 -m unittest -v scripts/test_p3_qualification.py
      - name: Partial coverage evidence stays source-bound and incomplete
        run: |
          python3 scripts/gen_coverage_registry.py --check
          python3 -m unittest discover -s scripts -p test_coverage_registry.py -v
      - name: C-ABI and JNI compile
        run: |
          set -euo pipefail
          JNI_INC="$JAVA_HOME/include"
          gcc -std=c11 -Wall -Werror -fsyntax-only -x c shared/orb-spec/cabi/orb_kernel.h
          gcc -O2 -fPIC -c shared/orb-spec/cabi/orb_kernel_unboxed.c -o /tmp/orb_kernel.o
          gcc -O2 -fPIC -Wall -Werror -Wno-unused-parameter -I"$JNI_INC" -I"$JNI_INC/linux" -Iandroid_dashboard/app/src \
            -c android_dashboard/app/src/main/jni/orb_kernel_jni.c -o /tmp/orb_kernel_jni.o
          gcc -shared /tmp/orb_kernel.o /tmp/orb_kernel_jni.o -o /tmp/liborb_kernel.so
          python3 - <<'PY'
          import json, subprocess
          m = json.load(open("shared/orb-spec/kernel_abi.json"))
          syms = set(subprocess.run(["nm", "-D", "--defined-only", "/tmp/liborb_kernel.so"],
                                    capture_output=True, text=True, check=True).stdout.split())
          want = {f["name"] for f in m["functions"]}
          want |= {"Java_" + m["jni"]["class"].replace(".", "_") + "_" + f["jni"]["method"]
                   for f in m["functions"] if "jni" in f}
          missing = sorted(want - syms)
          assert not missing, f"missing exports: {missing}"
          print(f"{len(want)} manifest symbols exported")
          PY
      - name: Android JNI libraries rebuild with the NDK and match sources / ABI
        run: scripts/build_android_kernel_so.sh --check

      - name: Read reviewed turbo-lean source revision
        id: turbo-pin
        run: |
          revision=$(cat lean/turbo-lean-revision)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Th0rgal/turbo-lean
          ref: ${{ steps.turbo-pin.outputs.revision }}
          path: .tools/turbo-lean
          persist-credentials: false
      - name: Build reviewed turbo-lean and record binary provenance
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          source_dir="$PWD/.tools/turbo-lean"
          expected=$(cat lean/turbo-lean-revision)
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$expected"
          test -z "$(git -C "$source_dir" status --porcelain)"
          test "$(cat "$source_dir/lean/lean-toolchain")" = "$(cat lean/lean-toolchain)"
          (cd "$source_dir/lean" && lake build LeanSys LeanNative.Spec)
          cargo build --locked -j 1 --manifest-path "$source_dir/Cargo.toml" -p turbo-lean
          git -C "$source_dir" diff --exit-code
          mkdir -p audit-results
          python3 - <<'PYCODE'
          import hashlib, json, pathlib, subprocess
          binary = pathlib.Path(".tools/turbo-lean/target/debug/turbo-lean")
          receipt = {
              "repository": "https://github.com/Th0rgal/turbo-lean",
              "revision": pathlib.Path("lean/turbo-lean-revision").read_text().strip(),
              "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "version": subprocess.check_output([str(binary), "--version"], text=True).strip(),
          }
          pathlib.Path("audit-results/turbo-lean-provenance.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PYCODE
      - name: Build and self-test OrbNetLeaf foundation (<= 220 C LOC, zero lean_elab)
        run: |
          set -euo pipefail
          ./scripts/ci_harden_ubuntu_apt.sh
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libsqlite3-dev
          c_lines=$(wc -l < lean/OrbNetLeaf/c/orb_net_leaf.c)
          echo "orb_net_leaf.c LOC: $c_lines"
          test "$c_lines" -le 220
          (cd lean/OrbNetLeaf && lake build -- -DwarningAsError=true && ./.lake/build/bin/orb-net-leaf-test)
          elab_syms=$(nm -u lean/OrbNetLeaf/.lake/build/bin/orb-net-leaf-test | grep -c lean_elab || true)
          test "$elab_syms" -eq 0
      - name: Build and self-test Wave 1 OrbBin + Wave 2 OrbNode + Wave 3 OrbClient + Wave 4 OrbCore & OrbLocald (<= 220 C LOC, zero lean_elab)
        run: |
          set -euo pipefail
          c_lines=$(wc -l < lean/OrbBin/c/orb_bin_posix.c)
          echo "orb_bin_posix.c LOC: $c_lines"
          test "$c_lines" -le 220
          sq_c_lines=$(wc -l < lean/OrbBin/c/orb_bin_sqlite.c)
          echo "orb_bin_sqlite.c LOC: $sq_c_lines"
          test "$sq_c_lines" -le 220
          node_c_lines=$(wc -l < lean/OrbNode/c/orb_node_posix.c)
          echo "orb_node_posix.c LOC: $node_c_lines"
          test "$node_c_lines" -le 220
          core_c_lines=$(wc -l < lean/OrbCore/c/orb_core_sqlite.c)
          echo "orb_core_sqlite.c LOC: $core_c_lines"
          test "$core_c_lines" -le 220
          shell_c_lines=$(wc -l < linux_shell/main.c)
          echo "linux_shell/main.c LOC: $shell_c_lines"
          test "$shell_c_lines" -le 220
          gtk_c_lines=$(wc -l < linux_shell/gtk_chrome.c)
          echo "linux_shell/gtk_chrome.c LOC: $gtk_c_lines"
          test "$gtk_c_lines" -le 220
          gtk_ic_lines=$(wc -l < linux_shell/gtk_icons.c)
          echo "linux_shell/gtk_icons.c LOC: $gtk_ic_lines"
          test "$gtk_ic_lines" -le 220
          gtk_menu_lines=$(wc -l < linux_shell/gtk_menu.c)
          echo "linux_shell/gtk_menu.c LOC: $gtk_menu_lines"
          test "$gtk_menu_lines" -le 220
          ./scripts/build_orb_bins.sh --out-dir target/debug
          (cd lean/OrbBin && lake build orb-bin-test -- -DwarningAsError=true && ./.lake/build/bin/orb-bin-test)
          (cd lean/OrbNode && lake build orb-node-test -- -DwarningAsError=true && ./.lake/build/bin/orb-node-test)
          (cd lean/OrbClient && lake build -- -DwarningAsError=true && ./.lake/build/bin/orb-client-test)
          (cd lean/OrbCore && lake build orb-core-test orb-spec-runner -- -DwarningAsError=true)
          ./lean/OrbCore/.lake/build/bin/orb-core-test
          ./lean/OrbCore/.lake/build/bin/orb-spec-runner --fixtures shared/orb-spec/fixtures
          (cd lean/OrbLocald && lake build orb-locald-test -- -DwarningAsError=true && ./.lake/build/bin/orb-locald-test)
          for test_bin in lean/OrbBin/.lake/build/bin/orb-bin-test lean/OrbNode/.lake/build/bin/orb-node-test lean/OrbClient/.lake/build/bin/orb-client-test lean/OrbCore/.lake/build/bin/orb-core-test lean/OrbCore/.lake/build/bin/orb-spec-runner lean/OrbLocald/.lake/build/bin/orb-locald-test; do
            elab_syms=$(nm -u "$test_bin" | grep -c lean_elab || true)
            test "$elab_syms" -eq 0
          done
          ax_out=$(printf 'import OrbClient.Reducers\n#print axioms OrbClient.Reducers.parse_encode_orb_client_patch_roundtrip\n' | LEAN_PATH="lean/OrbClient/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --stdin)
          echo "$ax_out"
          echo "$ax_out" | grep -qF "depends on axioms: [propext, Classical.choice, Quot.sound]"
          out=$(LEAN_PATH="lean/OrbClient/.lake/build/lib/lean:$(lean --print-prefix)/lib/lean" lean --run scripts/gen_client_core_fixtures.lean)
          diff <(printf '%s\n' "$out") shared/orb-spec/fixtures/client-core.json
          for bin in fido-agent-proxy orb-privd orb-sudo lean-mesh palomactl sandboxed-mcp workspace-mcp desktop-mcp automation-manager-mcp sandboxed-node orb-core orb-locald; do
            test -x "target/debug/$bin"
            elab_syms=$(nm -u "target/debug/$bin" | grep -c lean_elab || true)
            test "$elab_syms" -eq 0
          done
      - name: Fresh turbo-lean tightness and horizontal-packing gate
        env:
          TURBO_LEAN_NO_AUDIT_CACHE: "1"
          SANDBOXED_TELEMETRY_BATCH_ONLY: "1"
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts/test_spec_audit.py
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/Spec.lean > audit-results/spec-audit.json
          python3 scripts/check_spec_audit.py audit-results/spec-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/MutantSuite.lean > audit-results/mutant-audit.json
          python3 scripts/check_spec_audit.py audit-results/mutant-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/StatefulMutantSuite.lean > audit-results/stateful-mutant-audit.json
          python3 scripts/check_spec_audit.py audit-results/stateful-mutant-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/LifecycleSpec.lean > audit-results/lifecycle-spec-audit.json
          python3 scripts/check_spec_audit.py audit-results/lifecycle-spec-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/LifecycleMutants.lean > audit-results/lifecycle-mutant-audit.json
          python3 scripts/check_spec_audit.py audit-results/lifecycle-mutant-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/HarnessCloudSpec.lean > audit-results/harness-cloud-spec-audit.json
          python3 scripts/check_spec_audit.py audit-results/harness-cloud-spec-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/HarnessCloudMutants.lean > audit-results/harness-cloud-mutant-audit.json
          python3 scripts/check_spec_audit.py audit-results/harness-cloud-mutant-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/ManagedNodeSpec.lean > audit-results/managed-node-spec-audit.json
          python3 scripts/check_spec_audit.py audit-results/managed-node-spec-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/ManagedNodeMutants.lean > audit-results/managed-node-mutant-audit.json
          python3 scripts/check_spec_audit.py audit-results/managed-node-mutant-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/Stream.lean > audit-results/stream-audit.json
          python3 scripts/check_spec_audit.py audit-results/stream-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/Orb/Transcript.lean > audit-results/transcript-audit.json
          python3 scripts/check_spec_audit.py audit-results/transcript-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/OrbNetLeaf/OrbNetLeaf/Spec.lean > audit-results/orb-net-leaf-spec-audit.json
          python3 scripts/check_spec_audit.py audit-results/orb-net-leaf-spec-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/OrbNetLeaf/OrbNetLeaf/MutantSuite.lean > audit-results/orb-net-leaf-mutant-audit.json
          python3 scripts/check_spec_audit.py audit-results/orb-net-leaf-mutant-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/OrbBin/OrbBin/Spec.lean > audit-results/orb-bin-spec-audit.json
          python3 scripts/check_spec_audit.py audit-results/orb-bin-spec-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/OrbBin/OrbBin/MutantSuite.lean > audit-results/orb-bin-mutant-audit.json
          python3 scripts/check_spec_audit.py audit-results/orb-bin-mutant-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/OrbNode/OrbNode/Spec.lean > audit-results/orb-node-spec-audit.json
          python3 scripts/check_spec_audit.py audit-results/orb-node-spec-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/OrbNode/OrbNode/MutantSuite.lean > audit-results/orb-node-mutant-audit.json
          python3 scripts/check_spec_audit.py audit-results/orb-node-mutant-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/OrbClient/OrbClient/Spec.lean > audit-results/orb-client-spec-audit.json
          python3 scripts/check_spec_audit.py audit-results/orb-client-spec-audit.json
          .tools/turbo-lean/target/debug/turbo-lean --json audit-spec lean/OrbClient/OrbClient/MutantSuite.lean > audit-results/orb-client-mutant-audit.json
          python3 scripts/check_spec_audit.py audit-results/orb-client-mutant-audit.json
