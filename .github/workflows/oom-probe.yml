# Temporary: proves lean.ci re-runs an OOM-killed job once with more memory. Delete with the branch.
name: lean.ci OOM probe
on:
  pull_request:
    paths: [.github/workflows/oom-probe.yml]
jobs:
  oom-probe:
    # A label no other Orb job uses, so no runner swap with real CI.
    runs-on: lean-8vcpu-ubuntu-2604
    timeout-minutes: 15
    steps:
      - run: |
          echo "attempt ${GITHUB_RUN_ATTEMPT}"; free -m
          # 256 MiB touched chunks, ~8 GiB in a few seconds: the kernel OOM killer fires before live growth can catch up.
          python3 -c "import sys; xs=[bytearray(b'\x01'*(256<<20)) for _ in range(32)]; print('allocated', len(xs)//4, 'GiB')"
