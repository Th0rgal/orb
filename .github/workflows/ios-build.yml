name: iOS Build

# Path-gated like android-apk.yml so unrelated PRs don't pay the macOS-runner
# cost. This exists because the committed pbxproj once silently missed new
# views for days: we verify the project is regenerated and that it compiles.
on:
  push:
    branches: [master, main, "release/*"]
    paths:
      - ".github/workflows/ios-build.yml"
      - "ios_dashboard/**"
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ios-build.yml"
      - "ios_dashboard/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ios-build:
    name: iOS Build
    # Use the runner’s current Xcode, including the iOS 26 SDK.
    runs-on: macos-15
    # Skip CI on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ios_dashboard
    steps:
      - uses: actions/checkout@v6

      - name: Regenerate Xcode project using the Xcode Cloud hook
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
        run: bash ci_scripts/ci_post_clone.sh

      - name: Build (compile-only, no signing)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project SandboxedDashboard.xcodeproj \
            -scheme SandboxedDashboard \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

  orb-local-kit:
    name: OrbLocalKit tests (Linux)
    # Platform-neutral core of the on-iPhone agent runtime: harness dialects,
    # runner lifecycle, computer-use loop, MCP server, keyboard queue.
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: ios_dashboard/OrbLocalKit
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: swift test
