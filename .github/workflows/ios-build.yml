name: iOS Build

# Path-gated like android-apk.yml so unrelated PRs don't pay the macOS-runner
# cost. This exists because the committed pbxproj once silently missed new
# views for days: we verify the project is regenerated and that it compiles.
on:
  push:
    branches: [master, main, "release/*"]
    paths:
      - ".github/workflows/ios-build.yml"
      - "ios_dashboard/**"
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/ios-build.yml"
      - "ios_dashboard/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ios-build:
    name: iOS Build
    # The project targets iOS 26 / Swift 6: needs Xcode 26, which is the
    # default on macos-26. The step below pins the newest Xcode_26 installed.
    runs-on: macos-26
    # Skip CI on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ios_dashboard
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/DerivedData
          key: ${{ runner.os }}-ios-dd-${{ hashFiles('ios_dashboard/project.yml', 'ios_dashboard/**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ios-dd-${{ hashFiles('ios_dashboard/project.yml', 'ios_dashboard/**/Package.resolved') }}-
            ${{ runner.os }}-ios-dd-

      - name: Regenerate Xcode project using the Xcode Cloud hook
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
        run: bash ci_scripts/ci_post_clone.sh

      - name: Build (compile-only, no signing)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project SandboxedDashboard.xcodeproj \
            -scheme SandboxedDashboard \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      # TODO: the skipped cases fail on master today: two stale expectations,
      # and OrbRichTextTests, whose WKWebView asset loads time out on the hosted
      # simulator (passes or fails run to run). The iOS owners should fix them
      # and drop the skips. Everything else in the target is blocking.
      - name: Unit tests (SandboxedDashboardTests)
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          for runtime in sorted(devs, reverse=True):
              if "iOS-26" not in runtime:
                  continue
              for d in devs[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          sys.exit("no iOS 26 iPhone simulator")
          ')"
          echo "Simulator: $udid"
          xcodebuild test \
            -project SandboxedDashboard.xcodeproj \
            -scheme SandboxedDashboard \
            -destination "id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:SandboxedDashboardTests \
            -skip-testing:SandboxedDashboardTests/OrbContractTests/testFirstAvailableNodeSelectsLeastLoadedOnlineNode \
            -skip-testing:SandboxedDashboardTests/OrbRichTextTests \
            -skip-testing:SandboxedDashboardTests/OrbSettingsTests/testKimiUsesNativeDeviceFlowAndAPIKeysRemainEditable \
            CODE_SIGNING_ALLOWED=NO
