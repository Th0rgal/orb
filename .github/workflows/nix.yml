name: Nix

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/nix.yml'
      - 'flake.*'
      - 'nix/**'
      - 'lean/**'
      - 'scripts/build_orb_bins.sh'
      - 'scripts/turbo_lean.sh'
      - 'scripts/ensure_lean_sys.sh'
      - 'orb/package.json'
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/nix.yml'
      - 'flake.*'
      - 'nix/**'
      - 'lean/**'
      - 'scripts/build_orb_bins.sh'
      - 'scripts/turbo_lean.sh'
      - 'scripts/ensure_lean_sys.sh'
      - 'orb/package.json'
  workflow_dispatch:
    inputs:
      hybrid_desktop:
        description: Build and exercise the aarch64 Linux desktop package
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Orb with Nix
    if: github.event.pull_request.draft != true && !inputs.hybrid_desktop
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build and verify all 12 binaries
        run: |
          set -euo pipefail
          unset ORB_SKIP_TURBO_LEAN ORB_ALLOW_RAW_LAKE_FALLBACK
          out=$(nix build .#orb-core --max-jobs 1 --cores 2 --no-link --print-out-paths -L)
          for bin in fido-agent-proxy orb-privd orb-sudo lean-mesh palomactl sandboxed-mcp workspace-mcp desktop-mcp automation-manager-mcp sandboxed-node orb-core orb-locald; do
            test -x "$out/bin/$bin"
          done
          test "$(readlink "$out/bin/sandboxed-sh")" = orb-core

  hybrid-desktop:
    if: github.event_name == 'workflow_dispatch' && inputs.hybrid_desktop
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build the packaged launchers on aarch64
        run: nix build .#orb-desktop --max-jobs 1 --cores 2 -L
      - name: Exercise Classic and hybrid in a private Wayland session
        env:
          ORB_TEST_SCREENSHOT: ${{ runner.temp }}/hybrid-desktop.png
        run: |
          fonts=$(nix build --inputs-from . nixpkgs#inter --no-link --print-out-paths)
          export FONTCONFIG_FILE="$RUNNER_TEMP/fonts.conf"
          cat > "$FONTCONFIG_FILE" <<EOF
          <fontconfig>
            <include>/etc/fonts/fonts.conf</include>
            <dir>$fonts/share/fonts</dir>
          </fontconfig>
          EOF
          nix shell --inputs-from . nixpkgs#fontconfig nixpkgs#sway nixpkgs#grim nixpkgs#wtype nixpkgs#imagemagick nixpkgs#tesseract --command bash -euc '
            fc-match Inter
            export ORB_WEBKIT_TEST_BINARY="$PWD/result/bin/orb-desktop"
            export ORB_HYBRID_TEST_BINARY="$PWD/result/bin/orb-desktop-hybrid"
            export ORB_DIST_DIR="$(nix build .#orb-desktop.webUi --no-link --print-out-paths)"
            python3 -B lean/OrbDesktop/tests/hybrid_desktop.py
          '
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hybrid-desktop-screenshot
          path: ${{ runner.temp }}/hybrid-desktop.png
          if-no-files-found: ignore
