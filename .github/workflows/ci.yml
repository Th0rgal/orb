name: CI

on:
  push:
    branches: [master, main, "release/*"]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Run CI on a schedule to catch issues even without new commits
  schedule:
    - cron: '0 3 * * *' # Daily

permissions:
  contents: read

# Cancel in-progress runs only on PR pushes — pushes to master and the
# scheduled cron share the same `ref` group, so blanket
# `cancel-in-progress: true` had the schedule killing the post-merge
# push run (e.g. PR #400's master push CI was cancelled by the cron
# that fired ~1 min later, leaving master with a non-green badge).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Selects the jobs this change needs from ci/domains.toml. Unknown paths,
  # CI changes, master pushes and the nightly select everything.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    outputs:
      run_test: ${{ steps.plan.outputs.run_test }}
      run_harness_contract: ${{ steps.plan.outputs.run_harness_contract }}
      run_capability_matrix: ${{ steps.plan.outputs.run_capability_matrix }}
      run_policy_lint: ${{ steps.plan.outputs.run_policy_lint }}
      run_orb_unit: ${{ steps.plan.outputs.run_orb_unit }}
      run_orb_browser: ${{ steps.plan.outputs.run_orb_browser }}
      run_orb_performance: ${{ steps.plan.outputs.run_orb_performance }}
      run_orb_desktop_shell: ${{ steps.plan.outputs.run_orb_desktop_shell }}
      run_orb_macos_shell: ${{ steps.plan.outputs.run_orb_macos_shell }}
      run_docker: ${{ steps.plan.outputs.run_docker }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: plan
        run: |
          python3 scripts/ci_plan.py \
            --event "${{ github.event_name }}" --ref "${{ github.ref }}" \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    needs: plan
    if: (needs.plan.outputs.run_test == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-turbo-lean

      - name: Install native build dependencies
        run: |
          ./scripts/ci_harden_ubuntu_apt.sh
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libsqlite3-dev

      - name: Build all 12 native Lean binaries and run all self-test suites via turbo-lean
        run: |
          set -euo pipefail
          ./scripts/build_orb_bins.sh --with-tests --out-dir target/debug

  fmt:
    name: Format & Hygiene
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Verify zero Rust files, zero raw Lake in CI, C shim <= 220 LOC, and kernel call lint
        run: |
          set -euo pipefail
          rs_count=$(git ls-files '*.rs' | wc -l)
          test "$rs_count" -eq 0
          if grep -rnE '\blake\s+(build|exe)\b' .github/workflows .github/actions scripts/build_orb_bins.sh scripts/harness_contract_tests.sh scripts/gen_*.py; then
            echo "error: raw Lake build/exe invocation found in CI workflows or scripts; use turbo-lean" >&2
            exit 1
          fi
          for cfile in lean/OrbNetLeaf/c/orb_net_leaf.c lean/OrbBin/c/orb_bin_posix.c lean/OrbBin/c/orb_bin_sqlite.c lean/OrbNode/c/orb_node_posix.c lean/OrbCore/c/orb_core_sqlite.c linux_shell/main.c linux_shell/gtk_chrome.c linux_shell/gtk_icons.c linux_shell/gtk_menu.c; do
            lines=$(wc -l < "$cfile")
            echo "$cfile: $lines LOC"
            test "$lines" -le 220
          done
          python3 scripts/lint_kernel_calls.py
          python3 scripts/check_state_inventory.py --require-all-completed

  harness-contract:
    name: Harness Contract Tests
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    needs: plan
    if: (needs.plan.outputs.run_harness_contract == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-turbo-lean

      - name: Install native build dependencies
        run: |
          ./scripts/ci_harden_ubuntu_apt.sh
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libsqlite3-dev

      - name: Run harness contract tests
        run: scripts/harness_contract_tests.sh

  capability-matrix:
    name: Capability Matrix Contract Check
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    needs: plan
    if: (needs.plan.outputs.run_capability_matrix == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v6

      - name: Validate capability matrix and surface contract evidence
        run: scripts/check-capability-matrix.sh

  policy-lint:
    name: Policy Lint
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    needs: plan
    if: (needs.plan.outputs.run_policy_lint == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-turbo-lean

      - name: Test project skill preparation and ownership
        run: |
          python3 -m pip install --user 'PyYAML>=6,<7' 'ruamel.yaml'
          python3 -m unittest discover -s tests -p project_skills_test.py
          python3 -m unittest discover -s tests -p library_skills_test.py

      # Every scripts/test_*.py. None reaches the network: remote-build tests use
      # example.invalid, unified-MCP tests use a 127.0.0.1 server. Build the native
      # Lean sandboxed-mcp companion first so test_unified_mcp_runtime.py runs.
      - name: Build native Lean sandboxed-mcp companion for runtime tests
        run: |
          ./scripts/ci_harden_ubuntu_apt.sh
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev
          ./scripts/build_orb_bins.sh --out-dir target/debug --only sandboxed-mcp

      - name: Run all script unit tests
        run: |
          python3 -m unittest discover -v -s scripts -p 'test_*.py'

  orb-unit:
    name: Orb unit
    runs-on: ubuntu-latest
    needs: plan
    if: (needs.plan.outputs.run_orb_unit == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule')
    defaults:
      run:
        working-directory: orb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orb/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orb/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --test scripts/check-bundle.test.mjs
      - run: pnpm check:bundle
      - run: pnpm test

  orb-browser:
    name: Orb browser (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    needs: plan
    if: (needs.plan.outputs.run_orb_browser == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: orb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orb/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orb/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-orb-playwright-${{ hashFiles('orb/pnpm-lock.yaml') }}
      # Downloads only on a cache miss; always installs the apt deps.
      - run: |
          ../scripts/ci_harden_ubuntu_apt.sh
          pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:browser --shard=${{ matrix.shard }}/2
      - name: Shared kernel startup and browser adapters
        if: matrix.shard == 1
        env:
          ORB_KERNEL_BROWSERS: chromium,webkit
        run: pnpm exec playwright test --config=playwright.kernel.config.ts
      - name: Shared kernel production startup and bundle projections
        if: matrix.shard == 1
        env:
          ORB_KERNEL_BROWSERS: chromium,webkit
        run: |
          pnpm build
          ORB_KERNEL_PREVIEW=1 pnpm exec playwright test --config=playwright.kernel.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-browser-evidence-${{ matrix.shard }}
          path: orb/test-results
          if-no-files-found: ignore

  # Timing-sensitive specs: report-only on PRs, blocking on master.
  orb-performance:
    name: Orb performance
    runs-on: ubuntu-24.04
    needs: plan
    if: (needs.plan.outputs.run_orb_performance == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule')
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: orb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orb/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orb/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-orb-playwright-${{ hashFiles('orb/pnpm-lock.yaml') }}
      # Downloads only on a cache miss; always installs the apt deps.
      - run: |
          ../scripts/ci_harden_ubuntu_apt.sh
          pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test -c playwright.performance.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-performance-evidence
          path: orb/test-results
          if-no-files-found: ignore

  orb-desktop-shell:
    name: Orb Desktop Shell (Lean + C)
    runs-on: ubuntu-24.04
    needs: plan
    if: (needs.plan.outputs.run_orb_desktop_shell == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-turbo-lean
      - name: Install WebKitGTK and Lean build deps
        run: |
          ./scripts/ci_harden_ubuntu_apt.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libsqlite3-dev
      - name: Build orb-locald + sandboxed-mcp and run Linux shell & wakeup MCP tests
        run: |
          set -euo pipefail
          ./scripts/build_orb_bins.sh --out-dir target/debug --only orb-locald --only sandboxed-mcp
          make -C linux_shell clean
          make -C linux_shell test
          python3 -m unittest -v orb/tests/wakeup_mcp_test.py

  orb-macos-shell:
    name: Orb macOS Shell & Signer (Swift)
    runs-on: macos-26
    needs: plan
    if: (needs.plan.outputs.run_orb_macos_shell == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile macos_shell, orb-signer, and macOS app icon
        run: |
          set -euo pipefail
          mkdir -p macos_shell/build
          swiftc -O -framework AppKit -framework WebKit -framework Security \
            macos_shell/main.swift -o macos_shell/build/orb-desktop
          python3 orb/scripts/build-signer.py
          node orb/scripts/build-macos-icon.mjs
          test -x macos_shell/build/orb-desktop
          ./macos_shell/build/orb-desktop --self-test
          test -x macos_shell/build/orb-signer
          test -f macos_shell/gen/app-icon/Assets.car

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: plan
    if: (needs.plan.outputs.run_docker == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v6
      - name: Verify Docker entrypoint with Windows line-ending settings
        run: |
          mkdir -p "$RUNNER_TEMP/orb-crlf-check"
          git -c core.autocrlf=true checkout-index --force \
            --prefix="$RUNNER_TEMP/orb-crlf-check/" -- docker/entrypoint.sh
          if LC_ALL=C grep -q $'\r' "$RUNNER_TEMP/orb-crlf-check/docker/entrypoint.sh"; then
            echo "Docker entrypoint contains CRLF line endings" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [dns]
              nameservers = ["1.1.1.1", "8.8.8.8"]
      # The image is the documented install path; build it so a missing
      # input (lockfile, build.rs, shared/ sources, a binary) fails here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: orb-ci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check fail-closed auth defaults and API proxy on default/custom backend ports
        run: |
          set -euo pipefail
          name="orb-docker-port-test"
          trap 'docker rm -f -v "$name" >/dev/null 2>&1 || true' EXIT

          # Shipped image has DEV_MODE=false and must fail closed without auth secrets.
          if docker run --rm --network none orb-ci:local >/tmp/orb-noauth.log 2>&1; then
            cat /tmp/orb-noauth.log
            echo "Expected container without auth secrets to exit non-zero" >&2
            exit 1
          fi

          for port in 3000 3100; do
            docker run -d --name "$name" --network none \
              -e "PORT=$port" \
              -e "DASHBOARD_PASSWORD=ci-test-strong-passphrase" \
              -e "JWT_SECRET=ci-test-random-jwt-secret-0123456789abcdef" \
              orb-ci:local
            ready=false
            for attempt in {1..60}; do
              if health="$(docker exec "$name" curl -fsS http://127.0.0.1:80/api/health 2>/dev/null)"; then
                echo "$health" | jq -e '.dev_mode == false and .auth_required == true' >/dev/null
                ws_code="$(docker exec "$name" curl -sS -o /dev/null -w '%{http_code}' --http1.1 \
                  -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
                  -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
                  -H 'Sec-WebSocket-Version: 13' \
                  http://127.0.0.1:80/api/console/ws)"
                [ "$ws_code" = "401" ]
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              docker logs "$name"
              exit 1
            fi
            docker rm -f -v "$name" >/dev/null
          done

  # Aggregate of the ci.yml jobs: skipped jobs pass, failed or cancelled ones
  # fail. It does not cover kernel-abi.yml, ios-build.yml or android-apk.yml,
  # so those keep their own required checks until they move into this file.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs: [plan, test, fmt, harness-contract, capability-matrix, policy-lint, orb-unit, orb-browser, orb-performance, orb-desktop-shell, orb-macos-shell, docker]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
