name: CI

on:
  push:
    branches: [master, main, "release/*"]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Run CI on a schedule to catch issues even without new commits
  schedule:
    - cron: '0 3 * * *' # Daily

permissions:
  contents: read

# Cancel in-progress runs only on PR pushes — pushes to master and the
# scheduled cron share the same `ref` group, so blanket
# `cancel-in-progress: true` had the schedule killing the post-merge
# push run (e.g. PR #400's master push CI was cancelled by the cron
# that fired ~1 min later, leaving master with a non-green badge).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 4
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run tests
        run: cargo test --locked --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run clippy
        run: cargo clippy --locked --workspace -- -D clippy::all

  fmt:
    name: Format
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  harness-contract:
    name: Harness Contract Tests
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: harness-contract
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run harness contract tests
        run: scripts/harness_contract_tests.sh

  capability-matrix:
    name: Capability Matrix Contract Check
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Validate capability matrix and surface contract evidence
        run: scripts/check-capability-matrix.sh

  policy-lint:
    name: Policy Lint
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - name: Test project skill preparation and ownership
        run: |
          python3 -m pip install --user 'PyYAML>=6,<7' 'ruamel.yaml'
          python3 -m unittest discover -s tests -p project_skills_test.py
          python3 -m unittest discover -s tests -p library_skills_test.py

      # Every scripts/test_*.py. None reaches the network: remote-build tests use
      # example.invalid, unified-MCP tests use a 127.0.0.1 server (and skip
      # without the binary). Nothing is excluded.
      - name: Run all script unit tests
        run: |
          python3 -m unittest discover -v -s scripts -p 'test_*.py'

  dashboard-test:
    name: Dashboard Unit Tests
    runs-on: ubuntu-latest
    # Skip CI on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dashboard dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            dashboard/node_modules
          key: ${{ runner.os }}-dashboard-bun-${{ hashFiles('dashboard/bun.lock', 'dashboard/package.json') }}
          restore-keys: |
            ${{ runner.os }}-dashboard-bun-

      - name: Cache Next.js build artifacts
        uses: actions/cache@v5
        with:
          path: dashboard/.next/cache
          key: ${{ runner.os }}-dashboard-next-${{ hashFiles('dashboard/bun.lock', 'dashboard/package.json') }}-${{ hashFiles('dashboard/next.config.ts', 'dashboard/src/**/*', 'dashboard/public/**/*') }}
          restore-keys: |
            ${{ runner.os }}-dashboard-next-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit

      - name: Type check and build
        run: bun run build

  orb-unit:
    name: Orb unit
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    defaults:
      run:
        working-directory: orb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orb/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orb/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm test

  orb-browser:
    name: Orb browser (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: orb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orb/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orb/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-orb-playwright-${{ hashFiles('orb/pnpm-lock.yaml') }}
      # Downloads only on a cache miss; always installs the apt deps.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:browser --shard=${{ matrix.shard }}/2
      - name: Shared kernel startup and browser adapters
        if: matrix.shard == 1
        run: pnpm exec playwright test --config=playwright.kernel.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-browser-evidence-${{ matrix.shard }}
          path: orb/test-results
          if-no-files-found: ignore

  # Timing-sensitive specs: report-only on PRs, blocking on master.
  orb-performance:
    name: Orb performance
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: orb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orb/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orb/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-orb-playwright-${{ hashFiles('orb/pnpm-lock.yaml') }}
      # Downloads only on a cache miss; always installs the apt deps.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test -c playwright.performance.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-performance-evidence
          path: orb/test-results
          if-no-files-found: ignore

  orb-tauri:
    name: Orb Tauri (Rust)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    defaults:
      run:
        working-directory: orb/src-tauri
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install WebKitGTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            orb/src-tauri -> target
          shared-key: orb-tauri
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # tauri-build checks that frontendDist and every externalBin exist, and
      # the run_recovery tests launch the real sandboxed-mcp companion, so build
      # it (what scripts/build-mcp.py does, without its -j1) and stage it.
      # orb-signer is macOS-only (tauri.macos.conf.json), as is gen/app-icon,
      # so neither is needed on Linux.
      - name: Build and stage sandboxed-mcp; stub frontend dist
        run: |
          set -euo pipefail
          (cd ../.. && cargo build --locked --bin sandboxed-mcp)
          host="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p ../dist binaries target/debug
          cp ../../target/debug/sandboxed-mcp "binaries/sandboxed-mcp-$host"
          cp ../../target/debug/sandboxed-mcp target/debug/sandboxed-mcp
      # TODO: make blocking once orb/src-tauri is rustfmt-clean (owned by the
      # Orb refactor; not reformatted here to avoid conflicts).
      - name: cargo fmt --check (non-blocking)
        continue-on-error: true
        run: cargo fmt --check
      # TODO: switch to `-- -D warnings` once orb/src-tauri's existing dead-code
      # and unused-variable warnings (mostly Linux-only cfg gaps) are fixed by
      # the Orb refactor owners. Compile errors still fail this step.
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked --bin orb

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      # The image is the documented install path; build it so a missing
      # input (lockfile, build.rs, shared/ sources, a binary) fails here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
