name: CI

on:
  workflow_dispatch:
    inputs:
      use_lean_runners:
        description: Use lean.ci runners (also requires ORB_LEAN_RUNNERS=true)
        type: boolean
        default: false
  push:
    branches: [master, main, "release/*"]
    # Roadmap/docs pushes must not queue behind (and so cancel) pending master runs.
    # Ordered paths filter (later matching pattern wins): include everything,
    # exclude prose docs, then re-include docs/ inputs read by CI scripts.
    paths:
      - '**'
      - '!docs/**'
      - '!README.md'
      - '!INSTALL.md'
      - '!DEBUGGING.md'
      - '!AGENTS.md'
      - 'docs/FORMAL_AUDIT.md'
      - 'docs/P1_SHARED_KERNEL_CONFORMANCE.md'
      - 'docs/P2_SHARED_WASM_ARTIFACT.md'
      - 'docs/P3_TARGET_QUALIFICATION_REPORT.md'
      - 'docs/TRUSTWORTHY_SHARED_LEAN_ROADMAP.md'
      - 'docs/specs/state-machine-inventory.md'
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Run CI on a schedule to catch issues even without new commits
  schedule:
    - cron: '0 3 * * *' # Daily

permissions:
  contents: read
  actions: read

# Cancel in-progress runs only on PR pushes — pushes to master and the
# scheduled cron share the same `ref` group, so blanket
# `cancel-in-progress: true` had the schedule killing the post-merge
# push run (e.g. PR #400's master push CI was cancelled by the cron
# that fired ~1 min later, leaving master with a non-green badge).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Selects the jobs this change needs from ci/domains.toml. Unknown paths,
  # CI changes, unverified master pushes and the nightly select everything.
  plan:
    name: Plan
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      tree_hash: ${{ steps.plan.outputs.tree_hash }}
      orb_build_hash: ${{ steps.plan.outputs.orb_build_hash }}
      dist_run_id: ${{ steps.plan.outputs.dist_run_id }}
      desktop_build_hash: ${{ steps.plan.outputs.desktop_build_hash }}
      desktop_run_id: ${{ steps.plan.outputs.desktop_run_id }}
      verification: ${{ steps.plan.outputs.verification }}
      run_test: ${{ steps.plan.outputs.run_test }}
      run_harness_contract: ${{ steps.plan.outputs.run_harness_contract }}
      run_capability_matrix: ${{ steps.plan.outputs.run_capability_matrix }}
      run_policy_lint: ${{ steps.plan.outputs.run_policy_lint }}
      run_orb_unit: ${{ steps.plan.outputs.run_orb_unit }}
      run_orb_browser: ${{ steps.plan.outputs.run_orb_browser }}
      run_orb_performance: ${{ steps.plan.outputs.run_orb_performance }}
      run_orb_desktop_shell: ${{ steps.plan.outputs.run_orb_desktop_shell }}
      run_orb_macos_shell: ${{ steps.plan.outputs.run_orb_macos_shell }}
      run_docker: ${{ steps.plan.outputs.run_docker }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: hashes
        run: python3 scripts/ci_plan.py --hashes-only --github-output "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        if: github.event_name == 'push'
        with:
          path: .ci/verified.json
          key: ci-verified-tree-${{ steps.hashes.outputs.tree_hash }}
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_plan.py \
            --event "${{ github.event_name }}" --ref "${{ github.ref }}" \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.sha }}" --receipt .ci/verified.json \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-32vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    # Skip CI on draft PRs unless explicitly requested
    needs: plan
    if: (needs.plan.outputs.run_test == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6

      - name: Install native build dependencies
        run: |
          ./scripts/ci_harden_ubuntu_apt.sh
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libsqlite3-dev zstd

      - name: Build all 12 native Lean binaries and run all self-test suites
        run: |
          set -euo pipefail
          ./scripts/build_orb_bins.sh --ensure-lean --out-dir target/debug
          export PATH="$HOME/.local/lean-4.35.0/bin:$PATH"
          (cd lean/OrbNetLeaf && lake build orb-net-leaf-test -- -DwarningAsError=true && ./.lake/build/bin/orb-net-leaf-test)
          (cd lean/OrbBin && lake build orb-bin-test -- -DwarningAsError=true && ./.lake/build/bin/orb-bin-test)
          (cd lean/OrbNode && lake build orb-node-test -- -DwarningAsError=true && ./.lake/build/bin/orb-node-test)
          (cd lean/OrbClient && lake build -- -DwarningAsError=true && ./.lake/build/bin/orb-client-test)
          (cd lean/OrbCore && lake build orb-core-test orb-spec-runner -- -DwarningAsError=true)
          ./lean/OrbCore/.lake/build/bin/orb-core-test
          ./lean/OrbCore/.lake/build/bin/orb-spec-runner --fixtures shared/orb-spec/fixtures
          (cd lean/OrbLocald && lake build orb-locald-test -- -DwarningAsError=true && ./.lake/build/bin/orb-locald-test)
          for bin in fido-agent-proxy orb-privd orb-sudo lean-mesh palomactl sandboxed-mcp workspace-mcp desktop-mcp automation-manager-mcp sandboxed-node orb-core orb-locald; do
            test -x "target/debug/$bin"
            elab_syms=$(nm -u "target/debug/$bin" | grep -c lean_elab || true)
            test "$elab_syms" -eq 0
          done

  fmt:
    name: Format & Hygiene
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    # Skip CI on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Verify zero Rust files, C shim <= 220 LOC, and kernel call lint
        run: |
          set -euo pipefail
          rs_count=$(git ls-files '*.rs' | wc -l)
          test "$rs_count" -eq 0
          for cfile in lean/OrbNetLeaf/c/orb_net_leaf.c lean/OrbBin/c/orb_bin_posix.c lean/OrbBin/c/orb_bin_sqlite.c lean/OrbBin/c/orb_bin_udp.c lean/OrbNode/c/orb_node_posix.c lean/OrbCore/c/orb_core_sqlite.c linux_shell/main.c linux_shell/gtk_chrome.c linux_shell/gtk_icons.c linux_shell/gtk_menu.c; do
            lines=$(wc -l < "$cfile")
            echo "$cfile: $lines LOC"
            test "$lines" -le 220
          done
          python3 scripts/lint_kernel_calls.py
          python3 scripts/check_state_inventory.py --require-all-completed

  harness-contract:
    name: Harness Contract Tests
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    # Skip CI on draft PRs unless explicitly requested
    needs: plan
    if: (needs.plan.outputs.run_harness_contract == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6

      - name: Install native build dependencies
        run: |
          ./scripts/ci_harden_ubuntu_apt.sh
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libsqlite3-dev zstd

      - name: Run harness contract tests
        run: scripts/harness_contract_tests.sh

  capability-matrix:
    name: Capability Matrix Contract Check
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    # Skip CI on draft PRs unless explicitly requested
    needs: plan
    if: (needs.plan.outputs.run_capability_matrix == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6

      - name: Validate capability matrix and surface contract evidence
        run: scripts/check-capability-matrix.sh

  policy-lint:
    name: Policy Lint
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    # Skip CI on draft PRs unless explicitly requested
    needs: plan
    if: (needs.plan.outputs.run_policy_lint == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6

      - name: Test project skill preparation and ownership
        run: |
          python3 -m pip install --user 'PyYAML>=6,<7' 'ruamel.yaml'
          python3 -m unittest discover -s tests -p project_skills_test.py
          python3 -m unittest discover -s tests -p library_skills_test.py

      # Every scripts/test_*.py. None reaches the network: remote-build tests use
      # example.invalid, unified-MCP tests use a 127.0.0.1 server. Build the native
      # Lean sandboxed-mcp companion first so test_unified_mcp_runtime.py runs.
      - name: Build native Lean sandboxed-mcp companion for runtime tests
        run: |
          ./scripts/ci_harden_ubuntu_apt.sh
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev zstd
          ./scripts/build_orb_bins.sh --ensure-lean --out-dir target/debug --only sandboxed-mcp

      - name: Run all script unit tests
        run: |
          python3 -m unittest discover -v -s scripts -p 'test_*.py'

  orb-build:
    name: Orb build
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-24.04' }}
    needs: plan
    if: (needs.plan.outputs.run_orb_unit == 'true' || needs.plan.outputs.run_orb_browser == 'true' || needs.plan.outputs.run_orb_performance == 'true' || needs.plan.outputs.dist_run_id != '') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    defaults:
      run:
        working-directory: orb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orb/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orb/pnpm-lock.yaml
      - uses: actions/cache@v5
        id: modules
        with:
          path: orb/node_modules
          key: orb-modules-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-node22-${{ hashFiles('orb/package.json', 'orb/pnpm-lock.yaml') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v5
        id: dist
        with:
          path: orb/dist
          key: orb-dist-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ needs.plan.outputs.orb_build_hash }}
      # PR cache scopes are invisible to master. Promote the proven build via
      # its run artifact, then actions/cache saves it in the master scope.
      - uses: actions/download-artifact@v4
        id: promoted-dist
        continue-on-error: true
        if: steps.dist.outputs.cache-hit != 'true' && needs.plan.outputs.dist_run_id != ''
        with:
          name: orb-dist
          path: orb/dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.dist_run_id }}
      - if: steps.dist.outputs.cache-hit != 'true' && (needs.plan.outputs.dist_run_id == '' || steps.promoted-dist.outcome == 'failure')
        env:
          ORB_BUILD_ID: ${{ needs.plan.outputs.orb_build_hash }}
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: orb-dist
          overwrite: true
          path: orb/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  orb-unit:
    name: Orb unit
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-24.04' }}
    needs: [plan, orb-build]
    if: (needs.plan.outputs.run_orb_unit == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    defaults:
      run:
        working-directory: orb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orb/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orb/pnpm-lock.yaml
      - uses: actions/cache@v5
        id: modules
        with:
          path: orb/node_modules
          key: orb-modules-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-node22-${{ hashFiles('orb/package.json', 'orb/pnpm-lock.yaml') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: orb-dist
          path: orb/dist
      - run: node --test scripts/check-bundle.test.mjs
      - run: pnpm check:bundle
      - run: pnpm test

  orb-browser:
    name: Orb browser (${{ matrix.shard }}/8)
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-24.04' }}
    # Version matches @playwright/test in orb/pnpm-lock.yaml. Contains browser
    # binaries, OS libraries and fonts; no per-shard apt update/install.
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    needs: [plan, orb-build]
    if: (needs.plan.outputs.run_orb_browser == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: orb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orb/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orb/pnpm-lock.yaml
      - uses: actions/cache@v5
        id: modules
        with:
          path: orb/node_modules
          key: orb-modules-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-node22-${{ hashFiles('orb/package.json', 'orb/pnpm-lock.yaml') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: orb-dist
          path: orb/dist
      - run: pnpm test:browser --shard=${{ matrix.shard }}/8
      - name: Shared kernel startup and browser adapters
        if: matrix.shard == 1
        env:
          ORB_KERNEL_BROWSERS: chromium,webkit
        run: pnpm exec playwright test --config=playwright.kernel.config.ts
      - name: Shared kernel production startup and bundle projections
        if: matrix.shard == 2
        env:
          ORB_KERNEL_BROWSERS: chromium,webkit
        run: ORB_KERNEL_PREVIEW=1 pnpm exec playwright test --config=playwright.kernel.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-browser-evidence-${{ matrix.shard }}
          path: orb/test-results
          if-no-files-found: ignore

  # Timing-sensitive specs: report-only on PRs, blocking on master.
  orb-performance:
    name: Orb performance
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-24.04' }}
    # Version matches @playwright/test in orb/pnpm-lock.yaml. Contains browser
    # binaries, OS libraries and fonts; no per-shard apt update/install.
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    needs: [plan, orb-build]
    if: (needs.plan.outputs.run_orb_performance == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    outputs:
      verified: ${{ steps.performance.outcome == 'success' }}
    defaults:
      run:
        working-directory: orb
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orb/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orb/pnpm-lock.yaml
      - uses: actions/cache@v5
        id: modules
        with:
          path: orb/node_modules
          key: orb-modules-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-node22-${{ hashFiles('orb/package.json', 'orb/pnpm-lock.yaml') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: orb-dist
          path: orb/dist
      - id: performance
        env:
          ORB_PERF_PREVIEW: "1"
        run: pnpm exec playwright test -c playwright.performance.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-performance-evidence
          path: orb/test-results
          if-no-files-found: ignore

  orb-desktop-shell:
    name: Orb Desktop Shell (Lean + C)
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-24.04' }}
    needs: plan
    if: (needs.plan.outputs.run_orb_desktop_shell == 'true' || needs.plan.outputs.desktop_run_id != '') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
      # Shell-only edits do not change these two Lean binaries. Reuse their
      # exact inputs, but always compile/test the shell and replay wakeup tests.
      - uses: actions/cache@v5
        id: desktop-bins
        with:
          path: |
            target/debug/orb-locald
            target/debug/sandboxed-mcp
          key: desktop-bins-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ needs.plan.outputs.desktop_build_hash }}
      - uses: actions/download-artifact@v4
        id: promoted-desktop
        continue-on-error: true
        if: steps.desktop-bins.outputs.cache-hit != 'true' && needs.plan.outputs.desktop_run_id != ''
        with:
          name: desktop-bins
          path: .ci/desktop
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.desktop_run_id }}
      - if: steps.promoted-desktop.outcome == 'success'
        run: tar -xf .ci/desktop/bins.tar
      - name: Install WebKitGTK and Lean build deps
        if: needs.plan.outputs.run_orb_desktop_shell == 'true' || (steps.desktop-bins.outputs.cache-hit != 'true' && steps.promoted-desktop.outcome != 'success')
        run: |
          ./scripts/ci_harden_ubuntu_apt.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libsqlite3-dev zstd
      - name: Build orb-locald + sandboxed-mcp
        if: steps.desktop-bins.outputs.cache-hit != 'true' && steps.promoted-desktop.outcome != 'success'
        run: ./scripts/build_orb_bins.sh --ensure-lean --out-dir target/debug --only orb-locald --only sandboxed-mcp
      - name: Run Linux shell & wakeup MCP tests
        if: needs.plan.outputs.run_orb_desktop_shell == 'true'
        run: |
          set -euo pipefail
          test -x target/debug/orb-locald
          test -x target/debug/sandboxed-mcp
          make -C linux_shell clean
          make -C linux_shell test
          python3 -m unittest -v orb/tests/wakeup_mcp_test.py

      # Tar preserves executable modes when promoted across run artifacts.
      - run: |
          mkdir -p .ci/desktop
          tar -cf .ci/desktop/bins.tar target/debug/orb-locald target/debug/sandboxed-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-bins
          overwrite: true
          path: .ci/desktop/bins.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  orb-macos-shell:
    name: Orb macOS Shell & Signer (Swift)
    runs-on: macos-26
    needs: plan
    if: (needs.plan.outputs.run_orb_macos_shell == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile macos_shell, orb-signer, and macOS app icon
        run: |
          set -euo pipefail
          mkdir -p macos_shell/build
          swiftc -O -framework AppKit -framework WebKit -framework Security \
            macos_shell/main.swift -o macos_shell/build/orb-desktop
          python3 orb/scripts/build-signer.py
          node orb/scripts/build-macos-icon.mjs
          test -x macos_shell/build/orb-desktop
          ./macos_shell/build/orb-desktop --self-test
          test -x macos_shell/build/orb-signer
          test -f macos_shell/gen/app-icon/Assets.car

  docker:
    name: Docker image
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    needs: plan
    if: (needs.plan.outputs.run_docker == 'true') && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
      - name: Verify Docker entrypoint with Windows line-ending settings
        run: |
          mkdir -p "$RUNNER_TEMP/orb-crlf-check"
          git -c core.autocrlf=true checkout-index --force \
            --prefix="$RUNNER_TEMP/orb-crlf-check/" -- docker/entrypoint.sh
          if LC_ALL=C grep -q $'\r' "$RUNNER_TEMP/orb-crlf-check/docker/entrypoint.sh"; then
            echo "Docker entrypoint contains CRLF line endings" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [dns]
              nameservers = ["1.1.1.1", "8.8.8.8"]
      # The image is the documented install path; build it so a missing
      # input (lockfile, build.rs, shared/ sources, a binary) fails here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: orb-ci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check fail-closed auth defaults and API proxy on default/custom backend ports
        run: |
          set -euo pipefail
          name="orb-docker-port-test"
          trap 'docker rm -f -v "$name" >/dev/null 2>&1 || true' EXIT

          # Shipped image has DEV_MODE=false and must fail closed without auth secrets.
          if docker run --rm --network none orb-ci:local >/tmp/orb-noauth.log 2>&1; then
            cat /tmp/orb-noauth.log
            echo "Expected container without auth secrets to exit non-zero" >&2
            exit 1
          fi

          for port in 3000 3100; do
            docker run -d --name "$name" --network none \
              -e "PORT=$port" \
              -e "DASHBOARD_PASSWORD=ci-test-strong-passphrase" \
              -e "JWT_SECRET=ci-test-random-jwt-secret-0123456789abcdef" \
              orb-ci:local
            ready=false
            for attempt in {1..60}; do
              if health="$(docker exec "$name" curl -fsS http://127.0.0.1:80/api/health 2>/dev/null)"; then
                echo "$health" | jq -e '.dev_mode == false and .auth_required == true' >/dev/null
                ws_code="$(docker exec "$name" curl -sS -o /dev/null -w '%{http_code}' --http1.1 \
                  -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
                  -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
                  -H 'Sec-WebSocket-Version: 13' \
                  http://127.0.0.1:80/api/console/ws)"
                [ "$ws_code" = "401" ]
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              docker logs "$name"
              exit 1
            fi
            docker rm -f -v "$name" >/dev/null
          done

  # Aggregate of the ci.yml jobs: skipped jobs pass, failed or cancelled ones
  # fail. It does not cover kernel-abi.yml, ios-build.yml or android-apk.yml,
  # so those keep their own required checks until they move into this file.
  ci-ok:
    name: CI OK
    runs-on: ${{ vars.ORB_LEAN_RUNNERS == 'true' && (github.event_name != 'workflow_dispatch' || inputs.use_lean_runners) && github.repository == 'Th0rgal/orb' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'lean-16vcpu-ubuntu-2604' || 'ubuntu-latest' }}
    if: always() && (github.event.pull_request.draft == false || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [plan, test, fmt, harness-contract, capability-matrix, policy-lint, orb-build, orb-unit, orb-browser, orb-performance, orb-desktop-shell, orb-macos-shell, docker]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          test "${{ needs.plan.result }}" = success
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
      - uses: actions/checkout@v6
      - name: Record checks verified on the actual checkout tree
        env:
          CI_PLAN: ${{ needs.plan.outputs.verification }}
          CI_NEEDS: ${{ toJSON(needs) }}
          PERFORMANCE_VERIFIED: ${{ needs.orb-performance.outputs.verified }}
        run: python3 scripts/ci_plan.py --write-receipt .ci/verified.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-verification
          overwrite: true
          path: .ci/verified.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/cache/save@v5
        with:
          path: .ci/verified.json
          key: ci-verified-tree-${{ needs.plan.outputs.tree_hash }}
