name: "Setup pinned Lean 4.35.0 and cached turbo-lean"
description: "Installs SHA-256 verified Lean 4.35.0, restores or builds the pinned release turbo-lean binary once per revision, and persists the CAS and Lake artifacts."

runs:
  using: "composite"
  steps:
    - name: Install pinned Lean 4.35.0 toolchain and bubblewrap sandbox
      shell: bash
      run: |
        set -euo pipefail
        echo "TURBO_LEAN_TELEMETRY=off" >> "$GITHUB_ENV"
        echo "LEAN_NATIVE_TELEMETRY=off" >> "$GITHUB_ENV"
        echo "TURBO_LEAN_NO_DAEMON=1" >> "$GITHUB_ENV"
        # One line per package splitting native compile, exe link and publish time.
        echo "TURBO_LEAN_PROFILE_PHASES=1" >> "$GITHUB_ENV"
        # GitHub-hosted runners are small; lean.ci runners (boost-jit-*) get more vCPUs at boot
        # when engines are idle, so let Lean use what the VM has.
        if [[ "${RUNNER_NAME:-}" == boost-jit-* ]]; then
          echo "LEAN_NUM_THREADS=$(nproc)" >> "$GITHUB_ENV"
          echo "RAYON_NUM_THREADS=$(nproc)" >> "$GITHUB_ENV"
        elif [[ "${ORB_COLD_PROJECT:-0}" == 1 && ( "$GITHUB_JOB" == test || "$GITHUB_JOB" == docker ) ]]; then
          # Cold native builds spend minutes both elaborating and building Lake
          # executable targets. Let those stages use the hosted runner's cores.
          jobs=$(nproc)
          (( jobs <= 4 )) || jobs=4
          echo "LEAN_NUM_THREADS=$jobs" >> "$GITHUB_ENV"
          echo "ORB_TURBO_LEAN_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "RAYON_NUM_THREADS=$jobs" >> "$GITHUB_ENV"
          echo "Cold native build concurrency: $jobs (6144 MiB build budget)"
        else
          echo "LEAN_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "RAYON_NUM_THREADS=2" >> "$GITHUB_ENV"
        fi
        echo "TURBO_LEAN_MAX_MEMORY_MB=6144" >> "$GITHUB_ENV"
        cas="$HOME/.cache/turbo-lean/cas"
        if [[ "${ORB_COLD_PROJECT:-0}" == 1 ]]; then
          cas=$(mktemp -d "$RUNNER_TEMP/orb-cas-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-XXXXXX")
          shopt -s globstar nullglob
          for path in lean/**/.lake/build lean/**/.lake/packages target/debug docker/prebuilt; do
            [[ ! -e "$path" ]] || { echo "Unexpected existing project output: $path"; exit 1; }
          done
          echo "Cold $GITHUB_JOB at $GITHUB_SHA: empty CAS $cas; no Lake builds, desktop binaries or Docker prebuilds"
        fi
        echo "TURBO_LEAN_HOME=$cas" >> "$GITHUB_ENV"
        os_name="$(uname -s)"
        arch_name="$(uname -m)"
        if [[ "$os_name" == "Linux" ]]; then
          if ! command -v bwrap >/dev/null 2>&1 || ! command -v zstd >/dev/null 2>&1; then
            ./scripts/ci_harden_ubuntu_apt.sh
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends bubblewrap zstd
          fi
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
        fi
        lean_dest="$HOME/.elan/toolchains/leanprover--lean4---v4.35.0"
        if [[ ! -x "$lean_dest/bin/lean" ]]; then
          if [[ "$os_name" == "Linux" && "$arch_name" == "x86_64" ]]; then
            lean_url="https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst"
            lean_sha256="7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d"
          elif [[ "$os_name" == "Linux" && "$arch_name" == "aarch64" ]]; then
            lean_url="https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux_aarch64.tar.zst"
            lean_sha256="c8f0f8a3920e839718b1343e6781fd80a3e9b1024fbcd7078eb30f54e806b028"
          elif [[ "$os_name" == "Darwin" && "$arch_name" == "arm64" ]]; then
            lean_url="https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-darwin_aarch64.tar.zst"
            lean_sha256="c0c6f34f35ba1dcc5c4a5fd106fefab9eb5e8469712624dd2c868d51b63177c2"
          elif [[ "$os_name" == "Darwin" && "$arch_name" == "x86_64" ]]; then
            lean_url="https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-darwin.tar.zst"
            lean_sha256="0b43be5c7ecfb36016566a41005ab62bdb04743e6bfd5837e45f796ef4750b4e"
          else
            echo "error: unsupported platform $os_name/$arch_name for Lean 4.35.0" >&2
            exit 1
          fi
          lean_archive="/tmp/lean-4.35.0.tar.zst"
          curl --retry 5 --retry-all-errors -fsSL "$lean_url" -o "$lean_archive"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${lean_sha256}  ${lean_archive}" | sha256sum -c -
          else
            echo "${lean_sha256}  ${lean_archive}" | shasum -a 256 -c -
          fi
          mkdir -p "$lean_dest"
          tar --zstd -xf "$lean_archive" --strip-components=1 -C "$lean_dest"
          rm -f "$lean_archive"
        fi
        mkdir -p "$HOME/.local"
        ln -sfn "$lean_dest" "$HOME/.local/lean-4.35.0"
        echo "$lean_dest/bin" >> "$GITHUB_PATH"
        "$lean_dest/bin/lean" --version

    - name: Restore cached turbo-lean release binary
      id: cache-bin
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/turbo-lean/bin
          audit-results/turbo-lean-provenance.json
        key: turbo-lean-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/turbo-lean-revision') }}

    - name: Verify or build pinned turbo-lean release binary
      id: build-bin
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.elan/toolchains/leanprover--lean4---v4.35.0/bin:$HOME/.cargo/bin:$PATH"
        revision="$(tr -d '[:space:]' < lean/turbo-lean-revision)"
        [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
        cache_root="$HOME/.cache/turbo-lean"
        bin_dir="$cache_root/bin"
        bin_path="$bin_dir/turbo-lean"
        prov_path="$PWD/audit-results/turbo-lean-provenance.json"
        mkdir -p "$bin_dir" "$(dirname "$prov_path")"

        cache_valid=0
        if [[ -x "$bin_path" && -f "$prov_path" ]]; then
          if python3 - "$bin_path" "$prov_path" "$revision" <<'PY'
        import hashlib, json, pathlib, sys
        binary = pathlib.Path(sys.argv[1])
        receipt = json.loads(pathlib.Path(sys.argv[2]).read_text())
        expected_rev = sys.argv[3]
        actual_sha = hashlib.sha256(binary.read_bytes()).hexdigest()
        sys.exit(0 if receipt.get("repository") == "https://github.com/Th0rgal/turbo-lean" and receipt.get("profile") == "release" and receipt.get("revision") == expected_rev and receipt.get("binary_sha256") == actual_sha else 1)
        PY
          then
            cache_valid=1
          fi
        fi

        if [[ "$cache_valid" -eq 0 ]]; then
          source_dir="${RUNNER_TEMP:-/tmp}/turbo-lean-${revision}"
          rm -rf "$source_dir"
          git init -q "$source_dir"
          git -C "$source_dir" fetch --depth 1 https://github.com/Th0rgal/turbo-lean.git "$revision"
          git -C "$source_dir" checkout -q FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$revision"
          test -z "$(git -C "$source_dir" status --porcelain)"
          test "$(cat "$source_dir/lean/lean-toolchain")" = "$(cat lean/lean-toolchain)"
          if ! command -v cargo >/dev/null 2>&1; then
            # Hosted runners ship Rust; lean.ci guests do not. Install a pinned
            # minimal toolchain only on a cache miss.
            rustup_target="$(uname -m)-unknown-linux-gnu"
            [[ "$(uname -s)" == "Linux" ]] || { echo "error: cargo missing on $(uname -s)" >&2; exit 1; }
            rustup_init="${RUNNER_TEMP:-/tmp}/rustup-init"
            curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -fsSL \
              "https://static.rust-lang.org/rustup/dist/${rustup_target}/rustup-init" -o "$rustup_init"
            rustup_sha="$(curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -fsSL \
              "https://static.rust-lang.org/rustup/dist/${rustup_target}/rustup-init.sha256" | cut -d' ' -f1)"
            echo "${rustup_sha}  ${rustup_init}" | sha256sum -c -
            chmod +x "$rustup_init"
            "$rustup_init" -y --no-modify-path --profile minimal --default-toolchain 1.99.1
            rm -f "$rustup_init"
            cargo --version
          fi
          CARGO_BUILD_JOBS=2 CARGO_TARGET_DIR="$source_dir/target" cargo build --release --locked --manifest-path "$source_dir/Cargo.toml" -p turbo-lean
          git -C "$source_dir" diff --exit-code
          install -m 0755 "$source_dir/target/release/turbo-lean" "$bin_path"
          rm -rf "$source_dir"
          python3 - "$bin_path" "$prov_path" "$revision" <<'PY'
        import hashlib, json, pathlib, subprocess, sys
        binary = pathlib.Path(sys.argv[1])
        prov = pathlib.Path(sys.argv[2])
        revision = sys.argv[3]
        receipt = {
            "repository": "https://github.com/Th0rgal/turbo-lean",
            "revision": revision,
            "profile": "release",
            "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
            "version": subprocess.check_output([str(binary), "--version"], text=True).strip(),
        }
        prov.write_text(json.dumps(receipt, indent=2) + "\n")
        PY
          echo "need-save=true" >> "$GITHUB_OUTPUT"
        else
          echo "need-save=false" >> "$GITHUB_OUTPUT"
        fi

        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin_path" --version

    - name: Save cached turbo-lean release binary
      if: ((github.event_name == 'push' && github.ref == 'refs/heads/master') || startsWith(runner.name, 'boost-jit-')) && steps.build-bin.outputs.need-save == 'true' && steps.cache-bin.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cache/turbo-lean/bin
          audit-results/turbo-lean-provenance.json
        key: turbo-lean-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/turbo-lean-revision') }}

    # Most hosted PR jobs are restore-only to bound GitHub cache usage.
    # turbo-lean deliberately re-elaborates importers of local externs. Cache
    # only the downstream C compilation, keyed by preprocessed input, compiler
    # contents and flags. Never replace the Lean build or the executable link.
    - name: Configure validated native object cache
      if: runner.os == 'Linux' && (github.job == 'test' || github.job == 'docker' || github.job == 'orb-desktop-shell' || github.job == 'harness-contract')
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -x /usr/bin/ccache || ! -x /usr/bin/clang ]]; then
          ./scripts/ci_harden_ubuntu_apt.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache clang
        fi
        mkdir -p "$RUNNER_TEMP/orb-cc"
        printf '%s\n' '#!/bin/sh' 'exec /usr/bin/ccache /usr/bin/clang "$@"' > "$RUNNER_TEMP/orb-cc/clang"
        chmod 755 "$RUNNER_TEMP/orb-cc/clang"
        {
          echo "LEAN_CC=$RUNNER_TEMP/orb-cc/clang"
          if [[ "$GITHUB_JOB" == test && "$RUNNER_NAME" == boost-jit-* ]]; then
            # Lake fans out native object builds independently of turbo-lean's
            # module budget. Serialize cache misses; hits still run in parallel.
            printf '%s\n' '#!/bin/sh' 'exec flock -F "$RUNNER_TEMP/orb-cc/compile.lock" "$@"' > "$RUNNER_TEMP/orb-cc/compile-one"
            chmod 755 "$RUNNER_TEMP/orb-cc/compile-one"
            echo "CCACHE_PREFIX=$RUNNER_TEMP/orb-cc/compile-one"
          fi
          # lean.ci may serve a different cache partition on each runner.
          # Restore the object cache alongside the matching Lean build, rather
          # than depending on two independent fallback lookups there.
          if [[ "${ORB_COLD_PROJECT:-0}" == 1 || "$RUNNER_NAME" == boost-jit-* ]]; then
            echo "CCACHE_DIR=$TURBO_LEAN_HOME/orb-native-objects"
          else
            echo "CCACHE_DIR=$HOME/.cache/orb-native-objects"
          fi
          echo 'CCACHE_COMPILERCHECK=content'
          echo 'CCACHE_NODIRECT=1'
          echo 'CCACHE_MAXSIZE=512M'
        } >> "$GITHUB_ENV"
    - name: Restore native C compiler cache
      if: env.ORB_COLD_PROJECT != '1' && env.CCACHE_DIR != '' && !startsWith(runner.name, 'boost-jit-')
      uses: actions/cache@v5
      with:
        path: ~/.cache/orb-native-objects
        key: orb-cc-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision') }}-${{ github.sha }}
        restore-keys: orb-cc-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision') }}-
    - name: Restore Lean CAS and Lake artifacts (pull requests and read-only events)
      if: env.ORB_COLD_PROJECT != '1' && (github.event_name != 'push' || github.ref != 'refs/heads/master') && !startsWith(runner.name, 'boost-jit-') && !(github.job == 'docker' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/turbo-lean/cas
          lean/**/.lake/build
          lean/**/.lake/packages
        key: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean', 'lean/**/*.c', 'c/**/*.c', 'c/**/*.h') }}-${{ github.job }}
        restore-keys: |
          lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean', 'lean/**/*.c', 'c/**/*.c', 'c/**/*.h') }}-
          lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-
    # Hosted Docker cannot use lean.ci's cache service. Keep its latest native
    # build on the same-repository PR's merge ref; a later push can restore it
    # without publishing anything to master or trusting another PR's binaries.
    - name: Restore and save Lean CAS and Lake artifacts
      if: env.ORB_COLD_PROJECT != '1' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || startsWith(runner.name, 'boost-jit-') || (github.job == 'docker' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/turbo-lean/cas
          lean/**/.lake/build
          lean/**/.lake/packages
        key: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-${{ github.job }}-${{ startsWith(runner.name, 'boost-jit-') && env.CCACHE_DIR != '' && 'cc1-' || '' }}${{ hashFiles('lean/**/*.lean', 'lean/**/*.c', 'c/**/*.c', 'c/**/*.h') }}
        restore-keys: |
          lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-${{ github.job }}-${{ startsWith(runner.name, 'boost-jit-') && env.CCACHE_DIR != '' && 'cc1-' || '' }}
          lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-${{ github.job }}-
          ${{ github.job != 'test' && format('lean-build-{0}-{1}-{2}-', runner.os, runner.arch, hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json')) || '' }}
    - name: Report Test archive contents before compilation
      if: github.job == 'test' && env.CCACHE_DIR != ''
      shell: bash
      run: |
        echo "ref=$GITHUB_REF runner=$RUNNER_NAME compiler=$(clang --version | head -1)"
        for path in lean/OrbCore/.lake/build/bin/orb-core-test lean/OrbCore/.lake/build/ir/OrbCore/{Control,CliMain,SelfTest}.c.o.export; do
          if [[ -f "$path" ]]; then stat --printf='restored %n (%s bytes)\n' "$path"; else echo "absent $path"; fi
        done
        python3 -c 'import os,pathlib; r=list(pathlib.Path(os.environ["CCACHE_DIR"]).glob("*/*/*R")); print(f"ccache result files={len(r)} bytes={sum(p.stat().st_size for p in r)}")'
        ccache --zero-stats
