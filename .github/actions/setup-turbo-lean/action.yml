name: "Setup pinned Lean 4.35.0 and cached turbo-lean"
description: "Installs SHA-256 verified Lean 4.35.0, restores or builds the pinned release turbo-lean binary once per revision, and persists the CAS and Lake artifacts."

runs:
  using: "composite"
  steps:
    - name: Install pinned Lean 4.35.0 toolchain and bubblewrap sandbox
      shell: bash
      run: |
        set -euo pipefail
        echo "TURBO_LEAN_TELEMETRY=off" >> "$GITHUB_ENV"
        echo "LEAN_NATIVE_TELEMETRY=off" >> "$GITHUB_ENV"
        echo "TURBO_LEAN_NO_DAEMON=1" >> "$GITHUB_ENV"
        echo "LEAN_NUM_THREADS=1" >> "$GITHUB_ENV"
        echo "RAYON_NUM_THREADS=2" >> "$GITHUB_ENV"
        echo "TURBO_LEAN_MAX_MEMORY_MB=6144" >> "$GITHUB_ENV"
        echo "TURBO_LEAN_HOME=$HOME/.cache/turbo-lean/cas" >> "$GITHUB_ENV"
        os_name="$(uname -s)"
        arch_name="$(uname -m)"
        if [[ "$os_name" == "Linux" ]]; then
          if ! command -v bwrap >/dev/null 2>&1 || ! command -v zstd >/dev/null 2>&1; then
            ./scripts/ci_harden_ubuntu_apt.sh
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends bubblewrap zstd
          fi
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
        fi
        lean_dest="$HOME/.elan/toolchains/leanprover--lean4---v4.35.0"
        if [[ ! -x "$lean_dest/bin/lean" ]]; then
          if [[ "$os_name" == "Linux" && "$arch_name" == "x86_64" ]]; then
            lean_url="https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst"
            lean_sha256="7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d"
          elif [[ "$os_name" == "Linux" && "$arch_name" == "aarch64" ]]; then
            lean_url="https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux_aarch64.tar.zst"
            lean_sha256="c8f0f8a3920e839718b1343e6781fd80a3e9b1024fbcd7078eb30f54e806b028"
          elif [[ "$os_name" == "Darwin" && "$arch_name" == "arm64" ]]; then
            lean_url="https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-darwin_aarch64.tar.zst"
            lean_sha256="c0c6f34f35ba1dcc5c4a5fd106fefab9eb5e8469712624dd2c868d51b63177c2"
          elif [[ "$os_name" == "Darwin" && "$arch_name" == "x86_64" ]]; then
            lean_url="https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-darwin.tar.zst"
            lean_sha256="0b43be5c7ecfb36016566a41005ab62bdb04743e6bfd5837e45f796ef4750b4e"
          else
            echo "error: unsupported platform $os_name/$arch_name for Lean 4.35.0" >&2
            exit 1
          fi
          lean_archive="/tmp/lean-4.35.0.tar.zst"
          curl --retry 5 --retry-all-errors -fsSL "$lean_url" -o "$lean_archive"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${lean_sha256}  ${lean_archive}" | sha256sum -c -
          else
            echo "${lean_sha256}  ${lean_archive}" | shasum -a 256 -c -
          fi
          mkdir -p "$lean_dest"
          tar --zstd -xf "$lean_archive" --strip-components=1 -C "$lean_dest"
          rm -f "$lean_archive"
        fi
        mkdir -p "$HOME/.local"
        ln -sfn "$lean_dest" "$HOME/.local/lean-4.35.0"
        echo "$lean_dest/bin" >> "$GITHUB_PATH"
        "$lean_dest/bin/lean" --version

    - name: Restore cached turbo-lean release binary
      id: cache-bin
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/turbo-lean/bin
          audit-results/turbo-lean-provenance.json
        key: turbo-lean-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/turbo-lean-revision') }}

    - name: Verify or build pinned turbo-lean release binary
      id: build-bin
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.elan/toolchains/leanprover--lean4---v4.35.0/bin:$HOME/.cargo/bin:$PATH"
        revision="$(tr -d '[:space:]' < lean/turbo-lean-revision)"
        [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
        cache_root="$HOME/.cache/turbo-lean"
        bin_dir="$cache_root/bin"
        bin_path="$bin_dir/turbo-lean"
        prov_path="$PWD/audit-results/turbo-lean-provenance.json"
        mkdir -p "$bin_dir" "$(dirname "$prov_path")"

        cache_valid=0
        if [[ -x "$bin_path" && -f "$prov_path" ]]; then
          if python3 - "$bin_path" "$prov_path" "$revision" <<'PY'
        import hashlib, json, pathlib, sys
        binary = pathlib.Path(sys.argv[1])
        receipt = json.loads(pathlib.Path(sys.argv[2]).read_text())
        expected_rev = sys.argv[3]
        actual_sha = hashlib.sha256(binary.read_bytes()).hexdigest()
        sys.exit(0 if receipt.get("repository") == "https://github.com/Th0rgal/turbo-lean" and receipt.get("profile") == "release" and receipt.get("revision") == expected_rev and receipt.get("binary_sha256") == actual_sha else 1)
        PY
          then
            cache_valid=1
          fi
        fi

        if [[ "$cache_valid" -eq 0 ]]; then
          source_dir="${RUNNER_TEMP:-/tmp}/turbo-lean-${revision}"
          rm -rf "$source_dir"
          git init -q "$source_dir"
          git -C "$source_dir" fetch --depth 1 https://github.com/Th0rgal/turbo-lean.git "$revision"
          git -C "$source_dir" checkout -q FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$revision"
          test -z "$(git -C "$source_dir" status --porcelain)"
          test "$(cat "$source_dir/lean/lean-toolchain")" = "$(cat lean/lean-toolchain)"
          CARGO_BUILD_JOBS=2 CARGO_TARGET_DIR="$source_dir/target" cargo build --release --locked --manifest-path "$source_dir/Cargo.toml" -p turbo-lean
          git -C "$source_dir" diff --exit-code
          install -m 0755 "$source_dir/target/release/turbo-lean" "$bin_path"
          rm -rf "$source_dir"
          python3 - "$bin_path" "$prov_path" "$revision" <<'PY'
        import hashlib, json, pathlib, subprocess, sys
        binary = pathlib.Path(sys.argv[1])
        prov = pathlib.Path(sys.argv[2])
        revision = sys.argv[3]
        receipt = {
            "repository": "https://github.com/Th0rgal/turbo-lean",
            "revision": revision,
            "profile": "release",
            "binary_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
            "version": subprocess.check_output([str(binary), "--version"], text=True).strip(),
        }
        prov.write_text(json.dumps(receipt, indent=2) + "\n")
        PY
          echo "need-save=true" >> "$GITHUB_OUTPUT"
        else
          echo "need-save=false" >> "$GITHUB_OUTPUT"
        fi

        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin_path" --version

    - name: Save cached turbo-lean release binary
      if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.build-bin.outputs.need-save == 'true' && steps.cache-bin.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cache/turbo-lean/bin
          audit-results/turbo-lean-provenance.json
        key: turbo-lean-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/turbo-lean-revision') }}

    - name: Restore Lean CAS and Lake artifacts (pull requests and read-only events)
      if: github.event_name != 'push' || github.ref != 'refs/heads/master'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/turbo-lean/cas
          lean/**/.lake/build
          lean/**/.lake/packages
        key: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean', 'lean/**/*.c', 'c/**/*.c', 'c/**/*.h') }}-${{ github.job }}
        restore-keys: |
          lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean', 'lean/**/*.c', 'c/**/*.c', 'c/**/*.h') }}-
          lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-
    - name: Restore and save Lean CAS and Lake artifacts (master)
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/turbo-lean/cas
          lean/**/.lake/build
          lean/**/.lake/packages
        key: lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean', 'lean/**/*.c', 'c/**/*.c', 'c/**/*.h') }}-${{ github.job }}
        restore-keys: |
          lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean', 'lean/**/*.c', 'c/**/*.c', 'c/**/*.h') }}-
          lean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/turbo-lean-revision', 'lean/**/lakefile.lean', 'lean/**/lake-manifest.json') }}-
