# Orb's Linux desktop surface parity rules for Hyprland (U8).
# Import this fragment from the user's Hyprland configuration.
# Both GTK/WebKit (--webkit / --leanui-hybrid) and pure --leanui use the
# orb-desktop Wayland app_id/class; per-pixel premultiplied alpha provides the
# frosted sidebar (78% dark / 72% light) and solid 100% main pane without
# multiplying window-wide opacity.
decoration {
    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = true
        contrast = 0.85
        brightness = 0.98
        noise = 0.014
        vibrancy = 0.25
        vibrancy_darkness = 0.25
        popups = true
        popups_ignorealpha = 0.05
    }
}
windowrulev2 = opacity 1.0 override 1.0 override, class:^(orb-desktop)$
windowrulev2 = rounding 12, class:^(orb-desktop)$
