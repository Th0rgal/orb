# Orb's Linux desktop surface parity rules for Hyprland.
# Import this fragment from the user's Hyprland configuration.
# Both GTK/WebKit and LeanUI use the orb-desktop app_id/class.
windowrulev2 = opacity 0.94 override 0.94 override, class:^(orb-desktop)$
windowrulev2 = blur, class:^(orb-desktop)$
windowrulev2 = rounding 12, class:^(orb-desktop)$
