# old-agent (62 GiB RAM, two node slots)
# Install as /etc/systemd/user/sandboxed-node-job-.scope.d/50-memory-containment.conf
# Reload sandboxed-node's user manager. Applies to newly created job scopes.
# Other node sizes/capacities require their own memory budget.
[Scope]
MemoryMax=24G
MemorySwapMax=4G
OOMPolicy=continue
