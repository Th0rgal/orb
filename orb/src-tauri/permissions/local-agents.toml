  "local_interaction_unsubscribe",
  "local_interaction_answer",
  "local_session_git",
  "local_agents_cyber_capabilities",
  "local_agents_scan",
  "local_agents_workspace",
  "local_agents_directory",
  "local_agents_write",
  "local_machine_identity",
  "local_machine_transfer",
