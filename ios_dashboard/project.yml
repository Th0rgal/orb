name: SandboxedDashboard
options:
  bundleIdPrefix: md.thomas.openagent
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true

settings:
  base:
    # Single source of the app version for the app and the Live Activity extension
    # (both Info.plists read these). Bump CURRENT_PROJECT_VERSION (YYYYMMDDNN) for a
    # release; Xcode Cloud appends its run number (ci_scripts/ci_pre_xcodebuild.sh).
    MARKETING_VERSION: "1.14.0"
    CURRENT_PROJECT_VERSION: "2026102601"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: "Automatic"
    ENABLE_PREVIEWS: "YES"

targets:
  SandboxedDashboard:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SandboxedDashboard
        excludes:
          - "**/.DS_Store"
          - "Orb/MathAssets"
          - "Orb/MermaidAssets"
      - path: SandboxedDashboard/Orb/MathAssets
        type: folder
        buildPhase: resources
      - path: SandboxedDashboard/Orb/MermaidAssets
        type: folder
        buildPhase: resources
      - path: OrbLiveActivity/Shared
      - path: ../shared/orb-spec/cabi/orb_kernel_unboxed.c
        createIntermediateGroups: false
    settings:
      base:
        INFOPLIST_FILE: SandboxedDashboard/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: md.thomas.openagent.dashboard
        PRODUCT_NAME: "Orb"
        PRODUCT_MODULE_NAME: sandboxed_sh
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
    entitlements:
      path: SandboxedDashboard/SandboxedDashboard.entitlements
      properties: {}
    dependencies:
      - target: OrbLiveActivity

  OrbLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: OrbLiveActivity
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
      - path: ../shared/orb-spec/cabi/orb_kernel_unboxed.c
        createIntermediateGroups: false
    settings:
      base:
        INFOPLIST_FILE: OrbLiveActivity/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: md.thomas.openagent.dashboard.liveactivity
        PRODUCT_NAME: OrbLiveActivity
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"

  SandboxedDashboardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SandboxedDashboardTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: md.thomas.openagent.dashboard.tests
        PRODUCT_NAME: SandboxedDashboardTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Orb.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Orb"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SandboxedDashboard

  SandboxedDashboardUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SandboxedDashboardUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: md.thomas.openagent.dashboard.uitests
        PRODUCT_NAME: SandboxedDashboardUITests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: SandboxedDashboard
    dependencies:
      - target: SandboxedDashboard

schemes:
  SandboxedDashboard:
    build:
      targets:
        SandboxedDashboard: all
    test:
      targets:
        - SandboxedDashboardTests
        - SandboxedDashboardUITests
